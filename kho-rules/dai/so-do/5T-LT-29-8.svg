<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 208" width="680" height="208" font-family="Arial, Helvetica, sans-serif" font-size="14">
<rect width="680" height="208" fill="#fff"/>
<defs><marker id="mt" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker></defs>
<text x="40" y="20" font-style="italic" fill="#334155">Xe lửa vượt người đi xe đạp</text>
<line x1="40" y1="124" x2="640" y2="124" stroke="#0f172a" stroke-width="2"/>
<rect x="40" y="117" width="360" height="7" fill="#2563eb" opacity="0.85"/>
<text x="220" y="112" text-anchor="middle" font-size="12" fill="#2563eb">Xe lửa</text>
<line x1="400" y1="118" x2="400" y2="130" stroke="#0f172a" stroke-width="2"/>
<circle cx="400" cy="124" r="3" fill="#0f172a"/>
