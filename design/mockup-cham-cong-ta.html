<title>Mockup chấm công TA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Bố cục: cột trái = bàn điều khiển thử nghiệm (vai, giờ giả lập, kịch bản); cột phải = màn hình thật của vai đang chọn */
:root {
  --bg: #eef0f6; --panel: #ffffff; --soft: #f4f6fb; --line: #d8dce8; --fg: #182039; --muted: #5c6583;
  --navy: #16286b; --on-navy: #ffffff; --accent: #e8590c;
  --ok: #17794b; --ok-bg: #e3f5ec; --warn: #9a5b00; --warn-bg: #fff1dc; --bad: #b3261e; --bad-bg: #fde8e6; --info-bg: #e6ecff; --info: #2b3f9e;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d111e; --panel: #161c31; --soft: #1c2440; --line: #2b3557; --fg: #e7eaf6; --muted: #9aa3c0;
  --navy: #24388f; --on-navy: #ffffff; --accent: #ff8a45;
  --ok: #62d6a0; --ok-bg: #133526; --warn: #ffc27a; --warn-bg: #3b2a10; --bad: #ff9a92; --bad-bg: #3e1614; --info-bg: #1d2a5c; --info: #b3c1ff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d111e; --panel: #161c31; --soft: #1c2440; --line: #2b3557; --fg: #e7eaf6; --muted: #9aa3c0;
  --navy: #24388f; --on-navy: #ffffff; --accent: #ff8a45;
  --ok: #62d6a0; --ok-bg: #133526; --warn: #ffc27a; --warn-bg: #3b2a10; --bad: #ff9a92; --bad-bg: #3e1614; --info-bg: #1d2a5c; --info: #b3c1ff; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; padding-inline: 16px; padding-block: 16px 40px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; max-width: 1320px; margin-inline: auto; align-items: start; }
@media (max-width: 920px) { .app { grid-template-columns: minmax(0, 1fr); } }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.side h1 { margin: 0; font-size: 17px; font-weight: 800; color: var(--navy); }
:root[data-theme="dark"] .side h1 { color: var(--info); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .side h1 { color: var(--info); } }
.lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 13px; }
.btn:hover { background: var(--soft); }
.btn.pri { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.btn.acc { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.bad { color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn.on { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.clock { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kb { display: flex; flex-direction: column; gap: 4px; max-height: 360px; overflow: auto; }
.kb button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 9px; font-size: 13px; }
.kb button.on { border-color: var(--accent); background: var(--warn-bg); }
.kbbox { border: 1px solid var(--accent); border-radius: 8px; padding: 10px; background: var(--soft); font-size: 13px; }
.kbbox ol { margin: 6px 0 6px 18px; padding: 0; } .kbbox li { margin-bottom: 3px; }
.kbbox .want { color: var(--ok); font-weight: 600; }
main { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.bar { background: var(--navy); color: var(--on-navy); border-radius: 10px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center; }
.bar b { font-size: 16px; } .bar .sub { color: #c9d2ff; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 14px; font-weight: 700; }
.phone { max-width: 440px; display: flex; flex-direction: column; gap: 12px; }
.sub { color: var(--muted); font-size: 12.5px; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.p-ok { background: var(--ok-bg); color: var(--ok); } .p-warn { background: var(--warn-bg); color: var(--warn); }
.p-bad { background: var(--bad-bg); color: var(--bad); } .p-info { background: var(--info-bg); color: var(--info); }
.p-none { background: var(--soft); color: var(--muted); }
.item { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.item.now { border-color: var(--accent); }
.item .grow { flex: 1; min-width: 0; }
.item b { font-size: 14px; }
.big { width: 100%; padding: 14px; font-size: 16px; font-weight: 800; border-radius: 12px; border: 0; }
.big.in { background: var(--ok); color: #fff; } .big.out { background: var(--accent); color: #fff; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
.form input, .form select, .inp { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 8px; min-width: 0; width: 100%; }
.err { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 8px 10px; font-weight: 600; }
.okmsg { background: var(--ok-bg); color: var(--ok); border-radius: 8px; padding: 8px 10px; font-weight: 600; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
td.act { white-space: normal; min-width: 84px; } td.act .btn { display: block; width: 100%; margin-bottom: 4px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--soft); white-space: nowrap; }
td.r, th.r { text-align: right; } td.n { white-space: nowrap; }
tr.ca td { background: var(--soft); font-weight: 600; }
tr.sum td { font-weight: 800; border-top: 2px solid var(--navy); }
.total { font-size: 26px; font-weight: 800; color: var(--accent); }
.note { border-left: 3px solid var(--accent); background: var(--soft); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 13px; }
</style>

<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>

<script>
'use strict';
/* ============ DỮ LIỆU GIẢ (ERP — kênh 1) ============ */
const NS = { an:{ten:'An',vai:'ta'}, binh:{ten:'Bình',vai:'ta'}, chi:{ten:'Chi',vai:'ta'}, dung:{ten:'Dũng',vai:'ta'}, trang:{ten:'Trang (người duyệt)',vai:'duyet'}, ceo:{ten:'CEO',vai:'ceo'} };
const LOP = { '6S2':{si:10.7,chu:'an'}, '6S1':{si:7.0,chu:'binh'}, '7A1':{si:9.1,chu:'chi'}, '8B1':{si:11.9,chu:'chi'}, '9A1':{si:14.0,chu:'dung'} };
const D = n => { const d = new Date(2026, 9, 15 + n); return ymd(d); };           // D(0) = Thứ Năm 15/10/2026
const BUOI = [  // buổi học thường trên lịch ERP
  {id:'b1',d:D(-2),lop:'6S2',bat:'18:00',ket:'19:30'}, {id:'b2',d:D(-2),lop:'8B1',bat:'19:30',ket:'21:00'},
  {id:'b3',d:D(-1),lop:'6S1',bat:'18:00',ket:'19:30'}, {id:'b4',d:D(-1),lop:'9A1',bat:'19:30',ket:'21:30'},
  {id:'b5',d:D(-1),lop:'7A1',bat:'18:00',ket:'19:30',huy:true},
  {id:'b6',d:D(0),lop:'6S2',bat:'18:00',ket:'19:30'}, {id:'b7',d:D(0),lop:'6S1',bat:'18:00',ket:'19:30'},
  {id:'b8',d:D(0),lop:'8B1',bat:'18:00',ket:'19:30'}, {id:'b9',d:D(0),lop:'7A1',bat:'19:30',ket:'21:00'},
  {id:'b10',d:D(0),lop:'9A1',bat:'19:30',ket:'21:30',thi:true},
];
const CA_TRUC = [ {id:'c1',d:D(0),khoi:'Khối 6',bat:'17:00',ket:'18:00',ns:'an'}, {id:'c2',d:D(-1),khoi:'Khối 6',bat:'17:00',ket:'18:00',ns:'binh'}, {id:'c3',d:D(0),khoi:'Khối 9',bat:'17:00',ket:'18:00',ns:'dung'} ];
const BT = [    // buổi bổ trợ có HS trên ERP
  {id:'t1',d:D(0),loai:'bo_tro_bu',lop:'6S2',bat:'19:30',ket:'20:30',ns:'an',hs:'Minh Trí',coMat:1},
  {id:'t2',d:D(-1),loai:'bo_tro_duoi',lop:'6S1',bat:'16:30',ket:'18:00',ns:'binh',hs:'Bảo Anh',coMat:1},
  {id:'t3',d:D(0),loai:'bo_tro_yeu',lop:'9A1',bat:'18:00',ket:'19:00',ns:'dung',hs:'Gia Huy, Hà Thu',coMat:2},
];
const LOAI = [
  {ma:'tro_giang',ten:'Trợ giảng lớp học',nhom:'package',tinh:'tg',dv:'buoi',canLop:true},
  {ma:'bo_tro_dinh_ki',ten:'Trực bổ trợ khối',nhom:'package',tinh:'bo_tro',dv:'gio'},
  {ma:'bo_tro_bu',ten:'Bổ trợ bù',nhom:'package',tinh:'bo_tro',dv:'gio',canLop:true},
  {ma:'bo_tro_yeu',ten:'Bổ trợ yếu',nhom:'package',tinh:'bo_tro',dv:'gio',canLop:true},
  {ma:'bo_tro_duoi',ten:'Bổ trợ đuổi',nhom:'package',tinh:'bo_tro',dv:'gio',canLop:true},
  {ma:'bo_tro_chua_bai',ten:'Chữa bài cho học sinh',nhom:'package',tinh:'bo_tro',dv:'gio',canLop:true},
  {ma:'bo_tro_dac_biet',ten:'Bổ trợ đặc biệt (kèm riêng)',nhom:'ngoai',tinh:'dac_biet',dv:'buoi'},
  {ma:'trong_thi',ten:'Trông thi',nhom:'ngoai',tinh:'trong_thi',dv:'gio',canLop:true},
  {ma:'cham_thi',ten:'Chấm thi',nhom:'ngoai',tinh:'khac',dv:'gio'},
  {ma:'hop',ten:'Họp',nhom:'ngoai',tinh:'khac',dv:'gio'},
  {ma:'dao_tao',ten:'Đào tạo',nhom:'ngoai',tinh:'khac',dv:'gio'},
  {ma:'khac',ten:'Việc khác (bắt buộc ghi chú)',nhom:'ngoai',tinh:'khac',dv:'gio'},
];
const GIA0 = [
  {ma:'he_so_tg',ten:'Hệ số: trợ giảng + ET',gia:0.4,dv:'hệ số',tu:'2026-09-01'}, {ma:'he_so_btvn',ten:'Hệ số: chấm BTVN',gia:0.2,dv:'hệ số',tu:'2026-09-01'},
  {ma:'he_so_bo_tro',ten:'Hệ số: bổ trợ',gia:0.4,dv:'hệ số',tu:'2026-09-01'}, {ma:'chi_tieu_bo_tro_gio',ten:'Chỉ tiêu bổ trợ mỗi lớp',gia:8,dv:'giờ',tu:'2026-09-01'},
  {ma:'gia_trong_thi',ten:'Trông thi lớp khác',gia:50000,dv:'đ/giờ',tu:'2026-09-01'}, {ma:'gia_bo_tro_dac_biet',ten:'Bổ trợ đặc biệt',gia:150000,dv:'đ/buổi',tu:'2026-09-01'},
];
// Số liệu ERP của tháng 10 (ngày 1–12) đã chốt sẵn: buổi lớp cả tháng, buổi TA đã có công, buổi TA đã chấm BTVN, giờ bổ trợ
const NEN = {
  an:{lop:{'6S2':{tg:3,btvn:3}},bt:3}, binh:{lop:{'6S1':{tg:3,btvn:4}},bt:2},
  chi:{lop:{'7A1':{tg:3,btvn:3},'8B1':{tg:0,btvn:3}},bt:5}, dung:{lop:{'9A1':{tg:4,btvn:3}},bt:1.5},
};
const SO_BUOI = {'6S2':8,'6S1':8,'7A1':8,'8B1':8,'9A1':8}, BTVN_DM = 7;

/* ============ TRẠNG THÁI ============ */
let S;
function reset(keep) {
  S = { now:new Date(2026,9,15,16,55), vai:'an', tab:'cc', cas:[], viecs:[], gia:GIA0.map(g=>({...g,ai:'CEO'})), seq:1,
        kb:keep?S.kb:null, form:null, msg:null, chon:{}, mo:{}, loc:'cho' };
}
const nid = p => p + (S.seq++);
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const hm = d => d ? String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0') : '—';
const dm = s => { const [y,m,d]=s.split('-'); return +d+'/'+ +m; };
const thu = s => ['CN','T2','T3','T4','T5','T6','T7'][new Date(s+'T12:00').getDay()];
const toMin = t => { if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; };
const gio = (a,b) => (toMin(a)==null||toMin(b)==null) ? 0 : (toMin(b)-toMin(a))/60;
const tien = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const so = n => (Math.round(n*100)/100).toString().replace('.',',');
const loai = ma => LOAI.find(l=>l.ma===ma);
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const homNay = () => ymd(S.now);
const dt = (ngay,t) => new Date(ngay+'T'+t+':00');
const giaTai = (ma,ngay) => { const r=S.gia.filter(g=>g.ma===ma&&g.tu<=ngay).sort((a,b)=>a.tu<b.tu?1:-1)[0]; return r?r.gia:null; };
const bac = si => { const n=Math.round(si); return n>=21?1800000:n>=16?1600000:n>=13?1400000:n>=9?1200000:1000000; };

/* ============ LUẬT (giống hàm Postgres trong migration) ============ */
function caMo(ns){ return S.cas.find(c=>c.ns===ns&&c.ngay===homNay()&&!c.ra); }
function caCua(ns,ngay){ return S.cas.filter(c=>c.ns===ns&&c.ngay===ngay&&c.duyet!=='tuchoi').sort((a,b)=>b.vao-a.vao)[0]; }
function vaoCa(ns){ if(caMo(ns)) return caMo(ns); const c={id:nid('ca'),ns,ngay:homNay(),vao:new Date(S.now),ra:null,nguon:'app',khaiBu:false,duyet:'cho'}; S.cas.push(c); return c; }
function raCa(ns){ const c=caMo(ns); if(!c) throw 'Chưa vào ca hôm nay'; c.ra=new Date(S.now); }
function khaiBuCa(ns,ngay,vao,ra){
  const v=dt(ngay,vao), r=dt(ngay,ra);
  if(r<=v) throw 'Giờ ra phải sau giờ vào';
  if(r>S.now) throw 'Không khai bù cho giờ chưa tới';
  if(S.now-r>24*3600e3) throw 'Đã quá 24 giờ — nhờ quản lý nhập hộ';
  const mo=S.cas.find(c=>c.ns===ns&&c.ngay===ngay&&!c.ra);
  if(mo){ mo.ra=r; mo.khaiBu=true; return mo; }
  const c={id:nid('ca'),ns,ngay,vao:v,ra:r,nguon:'app',khaiBu:true,duyet:'cho'}; S.cas.push(c); return c;
}
function khaiViec(ns,o){   // o: {loai, ngay, lop, bat, ket, hs, ghichu, ref}
  const L=loai(o.loai), ngay=o.ngay||homNay();
  if(ngay>homNay()) throw 'Không khai trước cho ngày chưa tới';
  const het=dt(ngay,o.ket||'23:59');
  if(S.now-het>24*3600e3) throw 'Đã quá 24 giờ kể từ khi việc diễn ra — nhờ quản lý nhập hộ';
  const ca=caCua(ns,ngay); if(!ca) throw 'Chưa chấm công có mặt ngày '+dm(ngay);
  let lop=o.lop||null;
  if(!lop&&o.loai==='tro_giang') lop=Object.keys(LOP).find(k=>LOP[k].chu===ns)||null;
  if(L.canLop&&!lop) throw 'Loại việc "'+L.ten+'" cần chọn lớp';
  if(o.loai==='khac'&&!(o.ghichu||'').trim()) throw 'Việc khác phải ghi chú';
  if(o.bat&&o.ket&&toMin(o.ket)<=toMin(o.bat)) throw 'Giờ kết thúc phải sau giờ bắt đầu';
  if(o.ref&&S.viecs.some(v=>v.ns===ns&&v.ref===o.ref&&v.tt!=='tuchoi')) throw 'Việc này đã khai rồi';
  const v={id:nid('v'),ca:ca.id,ns,ngay,loai:o.loai,lop,bat:o.bat||null,ket:o.ket||null,hs:o.hs||'',ghichu:o.ghichu||'',ref:o.ref||null,
           nguon:o.ref?'he_thong':'tu_khai',khaiBu:ngay<homNay(),tt:'cho'};
  S.viecs.push(v); return v;
}
function goiY(ns){   // việc hôm nay theo lịch ERP
  const d=homNay(), nowM=S.now.getHours()*60+S.now.getMinutes(), r=[];
  BUOI.filter(b=>b.d===d&&!b.huy&&LOP[b.lop].chu===ns).forEach(b=>r.push({ref:b.id,loai:b.thi?'trong_thi':'tro_giang',lop:b.lop,bat:b.bat,ket:b.ket,ten:(b.thi?'Trông thi lớp ':'Trợ giảng lớp ')+b.lop}));
  CA_TRUC.filter(c=>c.d===d&&c.ns===ns).forEach(c=>r.push({ref:c.id,loai:'bo_tro_dinh_ki',lop:null,bat:c.bat,ket:c.ket,ten:'Trực bổ trợ '+c.khoi}));
  BT.filter(b=>b.d===d&&b.ns===ns).forEach(b=>r.push({ref:b.id,loai:b.loai,lop:b.lop,bat:b.bat,ket:b.ket,hs:b.hs,ten:loai(b.loai).ten+' · '+b.hs}));
  r.forEach(x=>{ x.dang=nowM>=toMin(x.bat)-30&&nowM<=toMin(x.ket)+30; x.da=S.viecs.some(v=>v.ns===ns&&v.ref===x.ref&&v.tt!=='tuchoi'); });
  return r.sort((a,b)=>toMin(a.bat)-toMin(b.bat));
}
function doiChieu(v){
  const L=loai(v.loai), co=[]; let khop=false, ho=null, ghi='';
  if(L.tinh==='tg'){
    const bs=BUOI.filter(b=>b.d===v.ngay&&b.lop===v.lop); khop=bs.some(b=>!b.huy);
    if(!bs.length) co.push('Không có buổi trên lịch'); else if(!khop) co.push('Buổi đã huỷ');
    if(S.viecs.some(o=>o.id!==v.id&&o.tt!=='tuchoi'&&loai(o.loai).tinh==='tg'&&o.lop===v.lop&&o.ngay===v.ngay&&o.ns!==v.ns)) co.push('Hai TA cùng buổi');
    if(LOP[v.lop]&&LOP[v.lop].chu!==v.ns) ho=NS[LOP[v.lop].chu].ten;
  } else if(v.loai==='bo_tro_dinh_ki'){
    const c=CA_TRUC.find(c=>c.d===v.ngay&&(c.id===v.ref||c.ns===v.ns)); khop=!!c;
    const cr=CA_TRUC.find(c=>c.id===v.ref); if(cr&&cr.ns!==v.ns) ho=NS[cr.ns].ten;
  } else if(['bo_tro_bu','bo_tro_yeu','bo_tro_duoi'].includes(v.loai)){
    khop=BT.some(b=>b.d===v.ngay&&b.loai===v.loai&&(b.id===v.ref||b.ns===v.ns)&&b.coMat>0);
  } else if(L.tinh==='trong_thi'){
    khop=BUOI.some(b=>b.d===v.ngay&&b.lop===v.lop&&b.thi&&!b.huy);
    if(LOP[v.lop]&&LOP[v.lop].chu===v.ns) ghi='Lớp mình: tính vào trợ giảng, không trả riêng';
  }
  const ca=S.cas.find(c=>c.id===v.ca);
  if(ca){ const vm=(ca.vaoChot||ca.vao), rm=(ca.raChot||ca.ra);
    if(v.bat&&toMin(v.bat)<vm.getHours()*60+vm.getMinutes()-15) co.push('Trước giờ vào ca');
    if(v.ket&&rm&&toMin(v.ket)>rm.getHours()*60+rm.getMinutes()+15) co.push('Sau giờ ra ca');
    if(ca.duyet==='tuchoi') co.push('Ca bị từ chối'); }

  const wTg=giaTai('he_so_tg',ky), wBt=giaTai('he_so_btvn',ky), wBo=giaTai('he_so_bo_tro',ky), ct=giaTai('chi_tieu_bo_tro_gio',ky);
  const lops=[...ten].sort().map(l=>{ const chu=LOP[l].chu===ns, n=(nen.lop[l]||{tg:0,btvn:0});
    const ngayTG=new Set(ok.filter(v=>v.lop===l&&['tg','trong_thi'].includes(loai(v.loai).tinh)).map(v=>v.ngay)).size;
    const tg=n.tg+ngayTG, bv=chu?n.btvn:0, b=bac(LOP[l].si), tlTg=tg/SO_BUOI[l], tlBv=bv/BTVN_DM;
    return {lop:l,chu,si:LOP[l].si,bac:b,tg,soBuoi:SO_BUOI[l],tlTg,bv,tlBv,tien:Math.round(b*(wTg*tlTg+wBt*tlBv)),hd:tg>0||bv>0}; });
  const gioBt=nen.bt+ok.filter(v=>loai(v.loai).tinh==='bo_tro').reduce((s,v)=>s+gio(v.bat,v.ket),0);
  let chuHd=lops.filter(l=>l.chu&&l.hd); if(!chuHd.length) chuHd=lops.filter(l=>l.tg>0);
  const nLop=chuHd.length, tongBac=chuHd.reduce((s,l)=>s+l.bac,0), tlBo=nLop?gioBt/(ct*nLop):0, tienBo=Math.round(wBo*tlBo*tongBac);

  const pk=lops.reduce((s,l)=>s+l.tien,0), tNgoai=ngoai.reduce((s,x)=>s+x.tien,0);
  return {lops,gioBt,nLop,ct,tlBo,tongBac,tienBo,ngoai,pk,tNgoai,tong:pk+tienBo+tNgoai};
}

const val=id=>{ const e=document.getElementById(id); return e?e.value:''; };
function thu_(fn,okText){ try{ fn(); S.msg=okText?{ok:true,t:okText}:null; } catch(e){ S.msg={ok:false,t:String(e&&e.message||e)}; } }
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.tagName==='INPUT') return; const a=b.dataset.act, ns=S.vai; S.msg=null;
  if(a==='gio') S.now=new Date(S.now.getTime()+ +b.dataset.m*60000);
  else if(a==='vai'){ S.vai=b.dataset.v; S.tab=NS[S.vai].vai==='ta'?'cc':'duyet'; S.mo={}; }
  else if(a==='kb') return chayKB(b.dataset.id);
  else if(a==='reset') reset();
  else if(a==='tab'){ S.tab=b.dataset.t; S.mo={}; }
  else if(a==='loc') S.loc=b.dataset.k;
  else if(a==='mo') S.mo[b.dataset.k]=!S.mo[b.dataset.k];
  else if(a==='vao') thu_(()=>vaoCa(ns),'Đã chấm công vào lúc '+hm(S.now));
  else if(a==='ra') thu_(()=>raCa(ns),'Đã chấm công ra lúc '+hm(S.now));
  else if(a==='tick'){ const x=goiY(ns).find(g=>g.ref===b.dataset.ref); thu_(()=>khaiViec(ns,{loai:x.loai,lop:x.lop,bat:x.bat,ket:x.ket,hs:x.hs,ref:x.ref}),'Đã khai: '+x.ten); }
  else if(a==='luu'){ const p=b.dataset.pre||''; thu_(()=>{ khaiViec(ns,{loai:val(p+'f_loai'),ngay:b.dataset.ngay,lop:val(p+'f_lop'),bat:val(p+'f_bat'),ket:val(p+'f_ket'),hs:val(p+'f_hs'),ghichu:val(p+'f_gc')}); if(!p) S.mo.them=false; },'Đã lưu việc'); }
  else if(a==='bo'){ const v=S.viecs.find(x=>x.id===b.dataset.id); v.tt='tuchoi'; v.lydo='TA tự bỏ'; }
  else if(a==='bu'){ const ngay=val('b_ngay'); thu_(()=>{ khaiBuCa(ns,ngay,val('b_vao'),val('b_ra')); S.mo.buNgay=ngay; },'Đã khai bù ca ngày '+dm(ngay)+'. Thêm việc của ngày đó bên dưới.'); }
  else if(a==='duyetlo'){ const cs=S.cas.filter(c=>c.duyet==='cho'&&S.chon[c.id]!==false&&document.getElementById('chk_'+c.id)).map(c=>c.id), vs=S.viecs.filter(v=>v.tt==='cho'&&S.chon[v.id]!==false&&document.getElementById('chk_'+v.id)).map(v=>v.id);
    thu_(()=>duyet(cs,vs,'duyet'),'Đã duyệt '+(cs.length+vs.length)+' dòng'); }
  else if(a==='tuchoi'){ const id=b.dataset.id, ld=val('ld_'+id); thu_(()=>{ b.dataset.kieu==='ca'?duyet([id],[],'tuchoi',ld):duyet([],[id],'tuchoi',ld); S.mo['tc_'+id]=false; },'Đã từ chối'); }
  else if(a==='chot'){ const c=S.cas.find(x=>x.id===b.dataset.id); thu_(()=>{ const v=dt(c.ngay,val('cv_'+c.id)), r=dt(c.ngay,val('cr_'+c.id)); if(r<=v) throw 'Giờ ra phải sau giờ vào'; c.vaoChot=v; c.raChot=r; S.mo['chot_'+c.id]=false; },'Đã chốt giờ'); }
  else if(a==='nhapho'){ thu_(()=>{ const ld=val('n_ld'); if(!ld.trim()) throw 'Nhập hộ phải ghi lý do'; const n=val('n_ns'), ngay=val('n_ngay'), L=loai(val('n_loai')), lop=val('n_lop');
      if(L.canLop&&!lop) throw 'Loại việc "'+L.ten+'" cần chọn lớp';
      const c={id:nid('ca'),ns:n,ngay,vao:dt(ngay,val('n_bat')),ra:dt(ngay,val('n_ket')),nguon:'nhap_ho',khaiBu:false,duyet:'duyet',lydo:ld}; S.cas.push(c);
      S.viecs.push({id:nid('v'),ca:c.id,ns:n,ngay,loai:L.ma,lop:lop||null,bat:val('n_bat'),ket:val('n_ket'),hs:'',ghichu:ld,ref:null,nguon:'nhap_ho',khaiBu:false,tt:'duyet',lydo:ld}); S.mo.nhapho=false; S.loc='all'; },'Đã nhập hộ (ghi là đã duyệt)'); }
  else if(a==='themgia'){ thu_(()=>{ const ma=val('g_ma'), g=+val('g_gia'), tu=val('g_tu'); if(!tu||!(g>=0)) throw 'Cần giá trị và ngày hiệu lực'; if(S.gia.some(x=>x.ma===ma&&x.tu===tu)) throw 'Đã có giá cho mục này với cùng ngày hiệu lực';
      const cu=S.gia.find(x=>x.ma===ma), L=LOAI.find(l=>'gia_'+l.ma===ma); S.gia.push({ma,ten:cu?cu.ten:L.ten,gia:g,dv:cu?cu.dv:(L.dv==='gio'?'đ/giờ':'đ/buổi'),tu,ai:nguoi(S.vai)}); },'Đã thêm giá mới'); }
  ve();
});
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset&&t.dataset.act==='chon'){ S.chon[t.dataset.id]=t.checked; ve(); } });
reset(); const h=(location.hash||'').slice(1); if(KB.some(k=>k.id===h)) chayKB(h); else ve();
</script>
