<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiến trúc rừng chibi</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e5eadc;color:#233c31;font:16px system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:26px}h1{margin:0 0 8px;font-size:28px}p{line-height:1.6}.backdrop{width:100%;border-radius:18px;display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:24px}article{background:#f0f2e9;border:1px solid #c3cebb;border-radius:18px;padding:16px;text-align:center}article img{width:100%;height:230px;object-fit:contain}h2{font-size:17px;margin:12px 0 4px}.stars{font-size:24px;letter-spacing:4px;color:#879876}small{font-size:12px;color:#647763}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){main{padding:16px}article img{height:155px}}</style>
<main><h1>Kiến trúc lục địa rừng · chibi</h1><p>Khối tròn, mái lớn, thân thấp và chi tiết giản lược để hợp nền mới. Độ phức tạp tăng dần từ túp lều đến lâu đài.</p><img class="backdrop" src="assets/backdrop/nen_rung_va_duong_mon.png" alt="Nền rừng chibi đã chốt"><section class="grid" id="grid"></section><p>Hàng 5 sao ở đây do HTML dựng để xem khoảng trống bên dưới; không nằm trong PNG công trình.</p></main>
<script>const buildings=[['01_tup_leu','Túp lều'],['02_nha_go','Nhà gỗ'],['03_thap_canh','Tháp canh'],['04_cau_day_leo','Cầu dây leo'],['05_den_co','Đền cổ'],['06_ham_nguc_goc_cay','Hầm ngục gốc cây'],['07_phao_dai','Pháo đài'],['08_lau_dai','Lâu đài']];for(const[n,label]of buildings){const card=document.createElement('article');card.innerHTML=`<img src="assets/decor/${n}.png" alt="${label}"><h2>${Number(n.slice(0,2))}. ${label}</h2><div class="stars" aria-label="5 sao thành thạo">☆☆☆☆☆</div><small>${n}.png</small>`;document.getElementById('grid').appendChild(card);}</script></html>
