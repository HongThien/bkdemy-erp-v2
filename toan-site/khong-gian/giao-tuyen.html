<!doctype html>

<title>Giao tuyến · Hình không gian 11</title>
<meta name="description" content="Mô hình 3D xoay được cho bài tìm giao tuyến, giao điểm: tô và mở rộng từng mặt phẳng, kéo dài các đường trong hai mặt cho tới khi cắt nhau.">

<style>
/* Phần riêng của trang giao tuyến; nền chung (sân khấu · bảng · thanh bước) lấy từ ../the-tich/khung.css */
.head{max-width:none;right:1rem}
.bai-tabs{pointer-events:auto;display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem}
.bai-tabs button{cursor:pointer;background:rgba(11,22,48,.82);border:1px solid var(--line);border-radius:999px;padding:.45em .9em;font:600 .76rem/1 var(--f-ui);color:var(--ink-2);min-height:2.3em}
.bai-tabs button[aria-current="page"]{background:var(--amber);border-color:var(--amber);color:#1a1000}
.views{top:auto;bottom:.8rem;max-width:70%}
.lb.mp{font:700 .85rem/1 var(--f-ui);font-style:normal;padding:.25em .55em;border-radius:.45em;background:rgba(4,9,20,.72);text-shadow:none}
.de{font:400 1rem/1.6 var(--f-ui)!important;color:var(--ink)!important}
.ys{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}
.ys li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.35rem .55rem;align-items:start;background:var(--card-2);border:1px solid var(--line);border-radius:.8rem;padding:.6rem .7rem}
.ys li.dang{border-color:rgba(92,225,255,.65)}
.ys .n{font:700 1rem/1.5 var(--f-ui);color:var(--scan)}
.ys .t{font:400 .95rem/1.5 var(--f-ui);color:var(--ink-2)}
.ys .nut{grid-column:2;display:flex;gap:.3rem}
.mini{cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:.55rem;padding:.4em .6em;font:600 .74rem/1 var(--f-ui);color:var(--ink-2);white-space:nowrap;min-height:2.2em}
.mini:hover{border-color:rgba(92,225,255,.7);color:var(--ink)}
.mini.d{background:rgba(110,231,168,.16);border-color:var(--ok);color:var(--ok)}
.mini.s{background:rgba(255,122,122,.14);border-color:#ff7a7a;color:#ff9b9b}
.dap{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.dap b{font:600 1.6rem/1 var(--f-data);color:var(--amber)}
.box{background:rgba(92,225,255,.05);border:1px solid rgba(92,225,255,.4);border-radius:.9rem;padding:.8rem .9rem;display:grid;gap:.45rem}
.box .kicker{margin:0}
.box h3{margin:0;font:800 1.15rem/1.2 var(--f-ui)}
.box p{margin:0}
.lbl3{font:600 .7rem/1.3 var(--f-data);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:-.35rem!important}
.tools{display:flex;flex-wrap:wrap;gap:.35rem}
.tool{cursor:pointer;display:inline-flex;align-items:center;gap:.45em;background:var(--card-2);border:1px solid var(--line);border-radius:.65rem;padding:.42em .6em;font:700 .86rem/1 var(--f-ui);color:var(--ink-2);min-height:2.4em}
.tool i{width:.8em;height:.8em;border-radius:.2em;flex:none;opacity:.35}
.tool em{font:600 .68rem/1 var(--f-data);font-style:normal;color:var(--muted)}
.tool.on{color:var(--ink);border-color:rgba(232,241,255,.45)}
.tool.on i{opacity:1}
.tool.on em{color:var(--scan)}
.tool.hot{border-color:var(--amber)}
.tool+.eye{margin-left:-.3rem}
.eye{cursor:pointer;background:var(--card-2);border:1px solid var(--line);border-left:0;border-radius:0 .65rem .65rem 0;padding:.42em .5em;font:600 .7rem/1 var(--f-ui);color:var(--muted);min-height:2.4em}
.eye:hover{color:var(--ink)}
.mp-g{display:inline-flex}
.mp-g .tool{border-radius:.65rem 0 0 .65rem}
.row2{display:flex;gap:.4rem;flex-wrap:wrap}
.steps ol{overflow-x:auto;justify-content:flex-start;scrollbar-width:thin}
@media (max-aspect-ratio:1/1),(max-width:720px){
  .bai-tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:.4rem}
  .bai-tabs button{font-size:.68rem;white-space:nowrap;flex:none}
  .hint{display:none}
}
</style>

<body>
<div id="app" class="app">
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Mô hình 3D, kéo để xoay"></canvas>
    <div class="labels" id="labels" aria-hidden="true"></div>
    <div class="head">
      <a class="ve" href="../">‹ Trang Toán</a>
      <div class="eyebrow" id="eyebrow">Toán 11 · Hình học không gian · Giao tuyến – giao điểm</div>
      <h1 id="tieuDe"></h1>
      <div class="bai-tabs" id="baiTabs" role="tablist"></div>
    </div>
    <div class="views" id="views">
      <button type="button" data-view="mac_dinh">Góc ban đầu</button>
      <button type="button" data-view="tren">Nhìn từ trên</button>
      <button type="button" data-view="ngang">Nhìn ngang</button>
    </div>
    <div class="hint" id="hint" style="bottom:3.6rem">Kéo để xoay · cuộn hoặc chụm hai ngón để phóng to</div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
  <nav class="steps" aria-label="Các bước"><button type="button" class="nav" id="prev">‹ Trước</button><ol id="chips"></ol><button type="button" class="nav next" id="next">Tiếp ›</button></nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegmentsGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineMaterial.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegments2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/Line2.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="giao-tuyen-bai.js"></script>
<script>
// ĐỘNG CƠ trang giao tuyến: một trang, nhiều bài (dữ liệu ở giao-tuyen-bai.js). Mỗi bài một "page": ?bai=<id>&buoc=<n>.
// Mỗi bước = một TRẠNG THÁI đầy đủ (mặt nào tô / mở rộng, đường nào nối / kéo dài, đường nào nhấn); mục Công cụ cho sửa tay trạng thái đó.
(function () {
'use strict'
const BAI = window.BAI_GIAO_TUYEN
if (!window.THREE) { document.body.insertAdjacentHTML('beforeend', '<p class="err">Không tải được thư viện 3D — cần có mạng.</p>'); return }
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)]
const clamp = (v, a, b) => Math.min(b, Math.max(a, v))
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches
const MAU = { xanh: 0x5ce1ff, hong: 0xff7ab6, luc: 0x6ee7a8, tim: 0xb69cff, vang: 0xffd166 }
const C_CANH = 0xe8f1ff, C_NOI = 0x9fdcff, C_KEO = 0x5ce1ff, C_HOT = 0xffb547
const hex = c => '#' + c.toString(16).padStart(6, '0')
const T = p => new THREE.Vector3(p[0], p[2], -p[1])   // toạ độ sách (x phải, y vào trong, z lên) → three (y lên)
const stage = $('#stage'), cv = $('#cv'), labelsEl = $('#labels'), panel = $('#panel')

// ── three.js ──
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true })
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 800)
const FAT = !!(THREE.Line2 && THREE.LineMaterial && THREE.LineGeometry)
const lineMats = new Set()
function mkLine(o) {   // đường 2 điểm; o.depthFunc chia nét thấy / nét khuất
  let l
  if (FAT) {
    const g = new THREE.LineGeometry(); g.setPositions([0, 0, 0, 1, 0, 0])
    const m = new THREE.LineMaterial({ color: 0xffffff, linewidth: 2, transparent: true, opacity: 1, depthWrite: false, depthTest: o.depthTest !== false, dashed: !!o.dashed, dashSize: 0.28, gapSize: 0.2 })
    if (o.dashed) m.defines.USE_DASH = ''
    if (o.depthFunc !== undefined) m.depthFunc = o.depthFunc
    m.resolution.set(stage.clientWidth || 1, stage.clientHeight || 1); lineMats.add(m)
    l = new THREE.Line2(g, m)
  } else {
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 1, 0, 0], 3))
    const m = new (o.dashed ? THREE.LineDashedMaterial : THREE.LineBasicMaterial)({ color: 0xffffff, transparent: true, depthWrite: false, depthTest: o.depthTest !== false, dashSize: 0.28, gapSize: 0.2 })
    if (o.depthFunc !== undefined) m.depthFunc = o.depthFunc
    l = new THREE.Line(g, m)
  }
  l.userData.dashed = !!o.dashed; l.renderOrder = o.order || 5; l.frustumCulled = false
  return l
}
function setLine(l, a, b) {
  if (FAT) {
    const at = l.geometry.attributes.instanceStart
    if (at) { const r = at.data.array; r[0] = a.x; r[1] = a.y; r[2] = a.z; r[3] = b.x; r[4] = b.y; r[5] = b.z; at.data.needsUpdate = true; l.geometry.computeBoundingSphere() }
    else l.geometry.setPositions([a.x, a.y, a.z, b.x, b.y, b.z])
  } else l.geometry.setAttribute('position', new THREE.Float32BufferAttribute([a.x, a.y, a.z, b.x, b.y, b.z], 3))
  if (l.userData.dashed) l.computeLineDistances()
}
function styleLine(l, color, width, opacity) {
  const m = l.material; m.color.setHex(color); m.opacity = opacity; if (FAT) m.linewidth = width
  l.visible = opacity > 0.01
}
// Nét kiểu sách: khối ghi độ sâu (không ghi màu) → mỗi đường vẽ 2 lần: nét liền chỗ thấy, nét đứt chỗ bị khối che.
const matGhiSau = new THREE.MeshBasicMaterial({ colorWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 2 })
const cap = () => ({ thay: mkLine({ depthFunc: THREE.LessEqualDepth }), khuat: mkLine({ dashed: true, depthFunc: THREE.GreaterDepth }) })

// ── máy quay ──
const GOC = { mac_dinh: { az: 0.5, pol: 1.13 }, tren: { az: 0, pol: 0.14 }, ngang: { az: 0.25, pol: 1.5 } }
const view = { az: 0.5, pol: 1.13, dist: 40, tx: 0, ty: 0, tz: 0 }, goal = Object.assign({}, view)
let R = 8, baseDist = 40
function fitDist(r) {
  const half = THREE.MathUtils.degToRad(camera.fov / 2), hh = Math.atan(Math.tan(half) * camera.aspect)
  return Math.max(r / Math.sin(half), r / Math.sin(hh)) * 1.02
}
function denGoc(az, pol, instant) {
  while (az - view.az > Math.PI) az -= 2 * Math.PI; while (az - view.az < -Math.PI) az += 2 * Math.PI
  Object.assign(goal, { az, pol: clamp(pol, 0.12, 2.75), dist: baseDist })
  if (instant) Object.assign(view, goal)
}
function nhinThang(key) {   // máy quay vuông góc với mặt phẳng, đứng về phía đang nhìn
  const p = bai.mp[key], P = p.da.map(n => T(bai.diem[n]))
  const nv = new THREE.Vector3().subVectors(P[1], P[0]).cross(new THREE.Vector3().subVectors(P[2], P[0])).normalize()
  const cam = new THREE.Vector3().subVectors(camera.position, new THREE.Vector3(view.tx, view.ty, view.tz))
  if (nv.dot(cam) < 0) nv.negate()
  if (nv.y < 0.05 && Math.abs(nv.y) < 0.9) nv.y = Math.max(nv.y, 0.05)   // đừng chui xuống dưới đáy
  nv.normalize()
  denGoc(Math.atan2(nv.x, nv.z), Math.acos(clamp(nv.y, -1, 1)))
}
function placeCamera() {
  const sp = Math.sin(view.pol)
  camera.position.set(view.tx + view.dist * sp * Math.sin(view.az), view.ty + view.dist * Math.cos(view.pol), view.tz + view.dist * sp * Math.cos(view.az))
  camera.lookAt(view.tx, view.ty, view.tz)
}
const ptr = new Map(); let pinchD = 0
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button,a')) return
  ptr.set(e.pointerId, [e.clientX, e.clientY]); try { stage.setPointerCapture(e.pointerId) } catch (_) { }
  stage.classList.add('drag'); $('#hint').classList.add('off')
  if (ptr.size === 2) { const p = [...ptr.values()]; pinchD = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]) }
})
stage.addEventListener('pointermove', e => {
  const p = ptr.get(e.pointerId); if (!p) return
  const dx = e.clientX - p[0], dy = e.clientY - p[1]; p[0] = e.clientX; p[1] = e.clientY
  if (ptr.size === 1) { goal.az -= dx * 0.0065; goal.pol = clamp(goal.pol - dy * 0.0065, 0.12, 2.75); view.az = goal.az; view.pol = goal.pol }
  else if (ptr.size === 2) {
    const q = [...ptr.values()], d = Math.hypot(q[0][0] - q[1][0], q[0][1] - q[1][1])
    if (pinchD > 0 && d > 0) goal.dist = clamp(goal.dist * pinchD / d, baseDist * 0.35, baseDist * 2.4)
    pinchD = d
  }
})
const ptrUp = e => { ptr.delete(e.pointerId); pinchD = 0; if (!ptr.size) stage.classList.remove('drag') }
stage.addEventListener('pointerup', ptrUp); stage.addEventListener('pointercancel', ptrUp)
stage.addEventListener('wheel', e => { e.preventDefault(); goal.dist = clamp(goal.dist * Math.exp(e.deltaY * 0.0012), baseDist * 0.35, baseDist * 2.4); $('#hint').classList.add('off') }, { passive: false })
$$('#views button').forEach(b => b.addEventListener('click', () => { const g = GOC[b.dataset.view]; denGoc(g.az, g.pol) }))

// ── vật thể của bài đang mở ──
let bai = null, step = 1, nhom = null
let O = { doan: {}, mp: {}, diem: {} }                 // đối tượng vẽ
let st = { mp: {}, doan: {}, hot: new Set(), diem: new Set() }   // trạng thái đang hiện
const isCanh = k => bai.canh.includes(k) || bai.canh.includes(k[1] + k[0])
function tKey(k) { return bai.canh.find(c => c === k || c === k[1] + k[0]) || k }

function dung(b) {   // dựng toàn bộ vật thể cho bài b
  if (nhom) { scene.remove(nhom); nhom.traverse(x => { if (x.geometry) x.geometry.dispose(); if (x.material && x.material !== matGhiSau) { lineMats.delete(x.material); x.material.dispose() } }) }
  labelsEl.innerHTML = ''
  bai = b; nhom = new THREE.Group(); scene.add(nhom)
  O = { doan: {}, mp: {}, diem: {} }
  const P = {}; for (const n in b.diem) P[n] = T(b.diem[n])
  // khung nhìn: phủ mọi điểm
  const box = new THREE.Box3(); for (const n in P) box.expandByPoint(P[n])
  const c = box.getCenter(new THREE.Vector3()); R = 0; for (const n in P) R = Math.max(R, P[n].distanceTo(c))
  R = R * 1.08 + 0.6
  Object.assign(goal, { tx: c.x, ty: c.y, tz: c.z }); Object.assign(view, { tx: c.x, ty: c.y, tz: c.z })
  // khối ghi độ sâu
  const pos = []
  for (const f of b.mat) for (let j = 1; j < f.length - 1; j++) for (const n of [f[0], f[j], f[j + 1]]) pos.push(P[n].x, P[n].y, P[n].z)
  const gk = new THREE.BufferGeometry(); gk.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
  const khoi = new THREE.Mesh(gk, matGhiSau); khoi.renderOrder = -1; nhom.add(khoi)
  // đoạn thẳng: cạnh khối + đoạn khai trong doan + đoạn có nhắc trong bước
  const keys = new Set([...b.canh, ...Object.keys(b.doan)])
  for (const s of b.buoc) for (const k of [...Object.keys(s.doan || {}), ...(s.hot || [])]) keys.add(isCanh(k) ? tKey(k) : k)
  for (const k of keys) {
    const info = b.doan[k] || b.doan[k[1] + k[0]] || {}
    const a = P[k[0]], e = P[k[1]], len = a.distanceTo(e)
    let tmin = 0, tmax = 1
    for (const n of info.keo || []) { const t = new THREE.Vector3().subVectors(P[n], a).dot(new THREE.Vector3().subVectors(e, a)) / (len * len); tmin = Math.min(tmin, t); tmax = Math.max(tmax, t) }
    if (info.keo) { const m = 0.9 / len; if (tmin < 0) tmin -= m; if (tmax > 1) tmax += m }
    const seg = cap(), ext = cap()
    for (const x of [seg.thay, seg.khuat]) { setLine(x, a, e); nhom.add(x) }
    for (const x of [ext.thay, ext.khuat]) { x.renderOrder = 4; nhom.add(x) }
    O.doan[k] = { k, a, e, tmin, tmax, keo: info.keo || [], canh: isCanh(k), seg, ext, al: 0, g: 0, last: '' }
  }
  // mặt phẳng: đa giác của nó (tô) + hình bình hành lớn (mở rộng) + viền + nhãn tên
  for (const k in b.mp) {
    const p = b.mp[k], col = MAU[p.mau] || MAU.xanh
    const V = p.da.map(n => P[n])
    const fp = []; for (let j = 1; j < V.length - 1; j++) for (const v of [V[0], V[j], V[j + 1]]) fp.push(v.x, v.y, v.z)
    const gf = new THREE.BufferGeometry(); gf.setAttribute('position', new THREE.Float32BufferAttribute(fp, 3))
    const mf = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, depthTest: false })
    const to = new THREE.Mesh(gf, mf); to.renderOrder = 2; nhom.add(to)
    // hệ trục trong mặt phẳng
    const u = new THREE.Vector3().subVectors(V[1], V[0]).normalize()
    const nv = new THREE.Vector3().subVectors(V[1], V[0]).cross(new THREE.Vector3().subVectors(V[2], V[0])).normalize()
    const w = new THREE.Vector3().crossVectors(nv, u)
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity
    for (const n of [...p.da, ...(p.phu || [])]) { const d = new THREE.Vector3().subVectors(P[n], V[0]); const x = d.dot(u), y = d.dot(w); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y) }
    const pad = Math.max(1.2, 0.18 * Math.max(x1 - x0, y1 - y0)); x0 -= pad; x1 += pad; y0 -= pad; y1 += pad
    const Q = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map(([x, y]) => V[0].clone().addScaledVector(u, x).addScaledVector(w, y))
    const gm = new THREE.BufferGeometry(); gm.setAttribute('position', new THREE.Float32BufferAttribute([Q[0], Q[1], Q[2], Q[0], Q[2], Q[3]].flatMap(v => [v.x, v.y, v.z]), 3))
    const mm = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, depthTest: false })
    const mo = new THREE.Mesh(gm, mm); mo.renderOrder = 1; nhom.add(mo)
    const vien = Q.map((q, i) => { const l = mkLine({ depthTest: false }); setLine(l, q, Q[(i + 1) % 4]); l.renderOrder = 3; nhom.add(l); return l })
    const el = document.createElement('div'); el.className = 'lb mp'; el.textContent = p.ten; el.style.color = hex(col); el.style.border = '1px solid ' + hex(col); el.style.display = 'none'; labelsEl.appendChild(el)
    O.mp[k] = { k, col, to, mo, vien, el, Q, giua: Q[0].clone().add(Q[2]).multiplyScalar(0.5), a1: 0, a2: 0 }
  }
  // điểm: chấm + nhãn
  for (const n in P) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 10), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, depthTest: false }))
    m.position.copy(P[n]); m.renderOrder = 9; nhom.add(m)
    const el = document.createElement('div'); el.className = 'lb'; el.textContent = n; el.style.display = 'none'; labelsEl.appendChild(el)
    O.diem[n] = { n, p: P[n], m, el, al: 0, on: false }
  }
  O.c = c
  resize()
}

// ── trạng thái ──
function trangThaiBuoc(i) {
  const s = bai.buoc[i - 1], mp = {}, doan = {}
  for (const k in bai.mp) mp[k] = (s.mp && s.mp[k]) || 0
  for (const k in O.doan) doan[k] = O.doan[k].canh ? 1 : 0
  for (const k in (s.doan || {})) doan[isCanh(k) ? tKey(k) : k] = s.doan[k]
  const hot = new Set((s.hot || []).map(k => isCanh(k) ? tKey(k) : k))
  for (const k of hot) doan[k] = Math.max(doan[k] || 0, 1)
  return { mp, doan, hot, diem: new Set(s.diem || []) }
}
function diemHien() {   // đỉnh khối + điểm bước gọi tên + đầu mút đoạn đang nối + điểm mà đường đang kéo dài tới
  const on = new Set([...bai.dinh, ...st.diem])
  for (const k in O.doan) { const v = st.doan[k]; if (v >= 1) { on.add(k[0]); on.add(k[1]) } if (v === 2) for (const n of O.doan[k].keo) on.add(n) }
  return on
}

// ── vòng lặp ──
const v3 = new THREE.Vector3()
function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16 }
function chieu(p) { v3.copy(p).project(camera); return [(v3.x * 0.5 + 0.5) * stage.clientWidth, (-v3.y * 0.5 + 0.5) * stage.clientHeight, v3.z < 1] }
function tick(dt) {
  const k = RM ? 1 : 1 - Math.exp(-dt * 7), kg = RM ? 1 : 1 - Math.exp(-dt * 3.2)
  for (const key in view) view[key] += (goal[key] - view[key]) * k
  placeCamera()
  // mặt phẳng
  for (const key in O.mp) {
    const o = O.mp[key], v = st.mp[key] || 0
    o.a1 += ((v >= 1 ? 1 : 0) - o.a1) * k; o.a2 += ((v === 2 ? 1 : 0) - o.a2) * k
    o.to.material.opacity = 0.3 * o.a1; o.to.visible = o.a1 > 0.01
    o.mo.material.opacity = 0.11 * o.a2; o.mo.visible = o.a2 > 0.01
    for (const l of o.vien) styleLine(l, o.col, 1.4, 0.55 * o.a2)
  }
  // đoạn thẳng
  for (const key in O.doan) {
    const o = O.doan[key], v = st.doan[key] || 0, hot = st.hot.has(key)
    o.al += ((v >= 1 ? 1 : 0) - o.al) * k
    o.g += ((v === 2 ? 1 : 0) - o.g) * kg
    const col = hot ? C_HOT : o.canh ? C_CANH : C_NOI, wd = hot ? 4.2 : o.canh ? 2.4 : 2.2
    styleLine(o.seg.thay, col, wd, o.al); styleLine(o.seg.khuat, col, wd * 0.8, o.al * 0.8)
    const g = o.g < 0.004 ? 0 : o.g
    if (g > 0) {
      const t0 = g * o.tmin, t1 = 1 + g * (o.tmax - 1), d = new THREE.Vector3().subVectors(o.e, o.a)
      const p0 = o.a.clone().addScaledVector(d, t0), p1 = o.a.clone().addScaledVector(d, t1)
      for (const l of [o.ext.thay, o.ext.khuat]) setLine(l, p0, p1)
    }
    const ce = hot ? C_HOT : C_KEO
    styleLine(o.ext.thay, ce, hot ? 3 : 2, g > 0 ? Math.min(1, g * 3) * 0.95 : 0); styleLine(o.ext.khuat, ce, hot ? 2.4 : 1.8, g > 0 ? Math.min(1, g * 3) * 0.75 : 0)
  }
  scene.updateMatrixWorld()
  renderer.render(scene, camera)
  // nhãn điểm: đẩy ra xa tâm khối trên màn hình
  const on = diemHien(), cs = chieu(O.c), r = rem()
  for (const n in O.diem) {
    const o = O.diem[n], want = on.has(n)
    o.al += ((want ? 1 : 0) - o.al) * k
    o.m.visible = o.al > 0.02; o.m.material.opacity = o.al
    o.m.material.color.setHex(st.diem.has(n) && !bai.dinh.includes(n) ? C_HOT : 0xffffff)
    const [x, y, ok] = chieu(o.p)
    const vis = o.al > 0.02 && ok
    if (vis !== o.on) { o.el.style.display = vis ? '' : 'none'; o.on = vis }
    if (vis) {
      let dx = x - cs[0], dy = y - cs[1]; const L = Math.hypot(dx, dy)
      if (L < 1) { dx = 0; dy = -1 } else { dx /= L; dy /= L }
      o.el.style.opacity = o.al.toFixed(2)
      o.el.classList.toggle('hot', st.diem.has(n) && !bai.dinh.includes(n))
      o.el.style.transform = 'translate(' + (x + dx * r * 0.95).toFixed(1) + 'px,' + (y + dy * r * 0.95).toFixed(1) + 'px) translate(-50%,-50%)'
    }
  }
  for (const key in O.mp) {
    const o = O.mp[key], vis = o.a2 > 0.3
    if (vis) {   // nhãn ở góc hình bình hành nằm trong khung, xa tâm khối nhất (trên màn hình), lùi vào 15%
      const W = stage.clientWidth, H = stage.clientHeight; let best = null, far = -1
      for (const q of o.Q) {
        const p = q.clone().lerp(o.giua, 0.15), [x, y, ok] = chieu(p)
        if (!ok || x < 40 || y < 120 || x > W - 40 || y > H - 60) continue
        const d = Math.hypot(x - cs[0], y - cs[1]); if (d > far) { far = d; best = [x, y] }
      }
      if (!best) { const [x, y] = chieu(o.giua); best = [x, y] }
      o.el.style.display = ''; o.el.style.transform = 'translate(' + best[0].toFixed(1) + 'px,' + best[1].toFixed(1) + 'px) translate(-50%,-50%)'
    }
    else o.el.style.display = 'none'
  }
}
let last = performance.now()
function loop(now) { requestAnimationFrame(loop); const dt = clamp((now - last) / 1000, 0, 0.05); last = now; tick(dt) }
function resize() {
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1, zoom = goal.dist / baseDist
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix()
  for (const m of lineMats) m.resolution.set(w, h)
  baseDist = fitDist(R); goal.dist = baseDist * (isFinite(zoom) && zoom > 0 ? zoom : 1)
}

// ── bảng bên phải ──
const tex = el => { if (window.renderMathInElement) renderMathInElement(el, { delimiters: [{ left: '$', right: '$', display: false }], throwOnError: false }) }
const moY = {}   // ý đã lật đáp án (giữ khi đổi bước)
function veBang() {
  const b = bai, mo = moY[b.id] || (moY[b.id] = new Set())
  let h = '<div class="kicker">' + b.nguon + '</div><h2>' + b.ten + '</h2><p class="de">' + b.de + '</p>'
  if (b.loai === 'ds') {
    h += '<ul class="ys">' + b.y.map(y => '<li data-y="' + y.n + '"><span class="n">' + y.n + ')</span><span class="t">' + y.chu + '</span><span class="nut">' +
      '<button type="button" class="mini" data-xem="' + y.buoc + '">Xem hình</button>' +
      '<button type="button" class="mini' + (mo.has(y.n) ? (y.dung ? ' d' : ' s') : '') + '" data-lat="' + y.n + '">' + (mo.has(y.n) ? (y.dung ? 'Đúng' : 'Sai') : 'Đáp án') + '</button></span></li>').join('') + '</ul>'
  } else {
    h += '<div class="dap"><button type="button" class="mini' + (mo.has('dap') ? ' d' : '') + '" data-lat="dap">' + (mo.has('dap') ? 'Đáp số' : 'Hiện đáp số') + '</button>' + (mo.has('dap') ? '<b>' + b.dap + '</b>' : '') + '</div>'
  }
  h += '<div class="box" id="buocBox"></div>'
  h += '<p class="lbl3">Công cụ · mặt phẳng</p><div class="tools" id="toolMp">' + Object.keys(b.mp).map(k =>
    '<span class="mp-g"><button type="button" class="tool" data-mp="' + k + '"><i style="background:' + hex(MAU[b.mp[k].mau] || MAU.xanh) + '"></i>' + b.mp[k].ten + '<em></em></button><button type="button" class="eye" data-nhin="' + k + '" title="Nhìn thẳng mặt ' + b.mp[k].ten + '">⊥ nhìn</button></span>').join('') + '</div>'
  const dk = Object.keys(O.doan).filter(k => !O.doan[k].canh || O.doan[k].keo.length)
  h += '<p class="lbl3">Công cụ · đường thẳng</p><div class="tools" id="toolDoan">' + dk.map(k => '<button type="button" class="tool" data-doan="' + k + '">' + k + '<em></em></button>').join('') + '</div>'
  h += '<div class="row2"><button type="button" class="mini" id="datLai">↺ Về đúng bước này</button><button type="button" class="mini" id="tatHet">Tắt hết mặt phẳng</button></div>'
  h += '<p class="note">Mặt phẳng: bấm lần lượt <b>Tô → Mở rộng → Ẩn</b>. Đường thẳng: <b>Nối → Kéo dài → Ẩn</b>. Nét đứt = phần bị khối che. Phím ← → để chuyển bước.</p>'
  panel.innerHTML = h; tex(panel)
  $$('[data-xem]', panel).forEach(x => x.addEventListener('click', () => goStep(+x.dataset.xem)))
  $$('[data-lat]', panel).forEach(x => x.addEventListener('click', () => { const n = x.dataset.lat; mo.has(n) ? mo.delete(n) : mo.add(n); const y = panel.scrollTop; veBang(); veBuoc(); capNhatCongCu(); panel.scrollTop = y }))
  $$('[data-mp]', panel).forEach(x => x.addEventListener('click', () => { const k = x.dataset.mp; st.mp[k] = ((st.mp[k] || 0) + 1) % 3; capNhatCongCu() }))
  $$('[data-nhin]', panel).forEach(x => x.addEventListener('click', () => { const k = x.dataset.nhin; if (!st.mp[k]) { st.mp[k] = 1; capNhatCongCu() } nhinThang(k) }))
  $$('[data-doan]', panel).forEach(x => x.addEventListener('click', () => {
    const k = x.dataset.doan, o = O.doan[k], v = st.doan[k] || 0, max = o.keo.length ? 2 : 1, min = o.canh ? 1 : 0
    st.doan[k] = v >= max ? min : v + 1; capNhatCongCu()
  }))
  $('#datLai').addEventListener('click', () => { st = trangThaiBuoc(step); capNhatCongCu(); datGocBuoc() })
  $('#tatHet').addEventListener('click', () => { for (const k in st.mp) st.mp[k] = 0; capNhatCongCu() })
}
function veBuoc() {
  const s = bai.buoc[step - 1]
  const box = $('#buocBox'); if (!box) return
  box.innerHTML = '<div class="kicker">Bước ' + step + ' / ' + bai.buoc.length + '</div><h3>' + s.ten + '</h3><p>' + s.chu + '</p>'; tex(box)
  if (bai.loai === 'ds') $$('.ys li', panel).forEach(li => { const y = bai.y.find(q => q.n === li.dataset.y); li.classList.toggle('dang', y.buoc === step) })
}
function capNhatCongCu() {
  const MP = ['Ẩn', 'Tô', 'Mở rộng'], DO = ['Ẩn', 'Nối', 'Kéo dài']
  $$('[data-mp]', panel).forEach(x => { const v = st.mp[x.dataset.mp] || 0; x.classList.toggle('on', v > 0); x.querySelector('em').textContent = MP[v] })
  $$('[data-doan]', panel).forEach(x => { const k = x.dataset.doan, v = st.doan[k] || 0; x.classList.toggle('on', v > 0); x.classList.toggle('hot', st.hot.has(k)); x.querySelector('em').textContent = DO[v] })
}

// ── bài + bước ──
function veTabs() {
  $('#baiTabs').innerHTML = BAI.map((b, i) => '<button type="button" role="tab" data-bai="' + b.id + '"' + (b === bai ? ' aria-current="page"' : '') + '>Bài ' + (i + 1) + ' · ' + b.tab + '</button>').join('')
  $$('#baiTabs button').forEach(x => x.addEventListener('click', () => moBai(x.dataset.bai, 1)))
}
function veChips() {
  $('#chips').innerHTML = bai.buoc.map((s, i) => '<li><button type="button" class="chip" data-step="' + (i + 1) + '"><span class="no">' + (i + 1) + '</span><span class="tx">' + s.ten + '</span></button></li>').join('')
  $$('#chips .chip').forEach(c => c.addEventListener('click', () => goStep(+c.dataset.step)))
}
function syncChips() {
  $$('#chips .chip').forEach((c, i) => { c.classList.toggle('done', i + 1 < step); if (i + 1 === step) { c.setAttribute('aria-current', 'step'); c.scrollIntoView({ block: 'nearest', inline: 'nearest' }) } else c.removeAttribute('aria-current') })
  $('#prev').disabled = step === 1; $('#next').disabled = step === bai.buoc.length
}
function datGocBuoc() { const s = bai.buoc[step - 1]; if (s.nhin) nhinThang(s.nhin) }
function luuDiaChi() { try { const q = new URLSearchParams(location.search); q.set('bai', bai.id); q.set('buoc', step); history.replaceState(null, '', '?' + q) } catch (_) { } }
function goStep(n) {
  n = clamp(n | 0, 1, bai.buoc.length); const truoc = step; step = n
  st = trangThaiBuoc(n); veBuoc(); capNhatCongCu(); syncChips(); luuDiaChi()
  const s = bai.buoc[n - 1]
  if (s.nhin) nhinThang(s.nhin)
  else if (truoc && bai.buoc[truoc - 1] && bai.buoc[truoc - 1].nhin) denGoc(GOC.mac_dinh.az, GOC.mac_dinh.pol)
}
function moBai(id, n) {
  const b = BAI.find(x => x.id === id) || BAI[0]
  dung(b); step = 0
  $('#tieuDe').textContent = b.ten; document.title = b.tab + ' · ' + b.ten
  veTabs(); veChips(); veBang()
  denGoc(GOC.mac_dinh.az, GOC.mac_dinh.pol, true); view.dist = goal.dist
  step = 1; goStep(n || 1); panel.scrollTop = 0
}
$('#prev').addEventListener('click', () => goStep(step - 1))
$('#next').addEventListener('click', () => goStep(step + 1))
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); goStep(step + 1) }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goStep(step - 1) }
})

new ResizeObserver(resize).observe(stage)
const q = new URLSearchParams(location.search)
moBai(q.get('bai'), +q.get('buoc') || 1)
requestAnimationFrame(loop)
// Soát bằng máy (Browser pane ẩn thì rAF không chạy): __dbg.run(ms) tua khung hình.
window.__dbg = { goStep, moBai, view, goal, st: () => st, run(ms) { for (let t = 0; t < ms; t += 16) tick(0.016) } }
})()
</script>
