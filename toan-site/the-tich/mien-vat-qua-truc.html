<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miền vắt qua trục quay · Thể tích khối tròn xoay</title>
<meta name="description" content="Mô hình 3D xoay được: quay hình phẳng giới hạn bởi parabol và đường thẳng quanh trục Ox khi hình phẳng nằm ở cả hai phía của trục; gấp phần dưới lên, chia ba miền, lắp công thức tròn xoay, cái bẫy công thức ra 0, thể tích 836π/15.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=Roboto+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="khung.css">
<style>
/* Màu riêng của bài: xanh = phần của (H) ở TRÊN trục quay · hồng = phần ở DƯỚI trục · đỏ = phần bị công thức sai trừ đi */
.panel b.tren{color:#5ce1ff}
.panel b.duoi{color:#ff7ab8}
.panel b.am{color:#ff7373}
.lb.so{font:700 .9rem/1 var(--f-data);width:1.75em;height:1.75em;display:grid;place-items:center;border-radius:50%;background:var(--amber);color:#1a1000;text-shadow:none}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegmentsGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineMaterial.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegments2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/Line2.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="khung.js"></script>
<script>
// BÀI: Câu 48 (NBV 12-18 F) — hình phẳng VẮT QUA trục quay. Phần dùng chung nằm ở khung.js / khung.css; file này chỉ có vật thể + bảng lời giải.
// Bài TRÒN XOAY có hàm tường minh ⇒ KHÔNG cắt lát / chồng lát (spec A4): gấp phần dưới trục lên, CHIA MIỀN, lắp thẳng công thức tròn xoay.
// Cái bẫy: π∫(g² − f²)dx trên cả đoạn cho ra ĐÚNG 0.
(function () {
'use strict'

// ═══ 1. SỐ LIỆU CỦA BÀI ═══
const f = x => x * x - 8 * x + 12        // parabol
const g = x => 6 - x                     // đường thẳng
const A = 1, P = 2, Q = 3, B = 6          // a, b: f = g · p: f = 0 (parabol cắt Ox) · q: g = −f (đường thẳng cắt đường gấp)
const TAU = Math.PI * 2                   // đáp số: 836π/15 ≈ 175,09
const C_TREN = 0x5ce1ff, C_DUOI = 0xff7ab8, C_NHAN = 0xffb547, C_AM = 0xff5b5b, C_TRUC = 0xdfe9ff

// ═══ 2. KHUNG CHUNG ═══
const gocCua = n => (n === 1 ? 'phang' : n === 3 ? 'gap' : 'ba_chieu')
const M = MoHinh({
  nhan: 'Toán 12 · Ứng dụng tích phân · Thể tích', tieuDe: 'Miền vắt qua trục quay',
  buoc: ['Đề bài', 'Quay quanh Ox', 'Chia miền', 'Cái bẫy', 'Tính thể tích'],
  nutGoc: [['mac_dinh', 'Góc ban đầu'], ['phang', 'Nhìn thẳng'], ['doc_truc', 'Nhìn dọc trục']],
  goc: {   // máy quay đứng phía +z: trục x chạy sang phải, y lên trên — đúng như hình vẽ trên giấy
    phang: { az: 0, pol: Math.PI / 2 },                 // nhìn thẳng vào mặt phẳng Oxy
    ba_chieu: { az: 0.55, pol: 1.16 },
    gap: { az: 0.34, pol: 1.22 },                       // hơi chếch để thấy phần dưới lật qua không gian
    doc_truc: { az: Math.PI / 2 - 0.02, pol: Math.PI / 2 - 0.02 },
  },
  khung: { chinh: { tx: 2.4, ty: 0.95, tz: 0, r: 6.9 } },   // ngắm hơi cao để hình không chạm tên bài ở góc trái trên
  khungNao: () => 'chinh', gocMacDinh: () => gocCua(M.step),
  bang: n => PANELS[n](), sauBang: bindPanel, truocBang, khiDoiBuoc,
  moiKhung: () => { if (dirty) { dirty = false; sync2(); sync3() } },
  dongBo,
  tiep: () => { if ((M.step === 4 && !S.thayBay) || (M.step === 5 && !S.thay)) { thaySo(); return true } return false },   // nút Tiếp / phím → cũng là "Thay số"
  nutTiep: () => (M.step === 4 && !S.thayBay ? { chu: 'Thay số ›' } : M.step === 5 ? { chu: S.thay ? 'Tiếp ›' : 'Thay số ›', tat: S.thay } : null),
  phimCach: () => { if (M.step !== 2) return false; S.playing ? stopPlay() : startPlay(); return true },
  thamSo: q => ({ sub: q.get('thay') === '1' }),   // ?thay=1: bước 3 mở sẵn hình đã gấp; bước 4, 5 mở sẵn phần thay số
})
if (!M) return
const { RM, $, scene, mkLine, setLine, setView, clock, anims, label, dot } = M

// ═══ 3. TRẠNG THÁI ═══
const S = {
  phi: 0,            // góc đã quay (0 → 2π)
  playing: false,
  fold: 0,           // bước 3: phần dưới đã lật lên bao nhiêu (0 → 1)
  thayBay: false, thay: false,   // bước 4, 5: đã bấm "Thay số"
}
Object.defineProperty(S, 'step', { get: () => M.step })
let dirty = true

// ═══ 4. VẬT THỂ (toạ độ cảnh = toạ độ toán: hình phẳng nằm trong mặt z = 0, trục quay là trục x) ═══
const pts = (fn, x0, x1, n) => { const o = []; for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n; o.push(x, fn(x), 0) } return o }
const circ = (x, r, n) => { const o = []; n = n || 72; for (let i = 0; i <= n; i++) { const t = TAU * i / n; o.push(x, r * Math.cos(t), r * Math.sin(t)) } return o }
const net = { color: C_TRUC, width: 1.4, opacity: 0.6, dashed: true, dash: 0.22, gap: 0.16, order: 4 }

// Hệ trục
scene.add(mkLine([-1.2, 0, 0, 7.7, 0, 0], { color: C_TRUC, width: 2.2, order: 4 }), mkLine([0, -5.3, 0, 0, 6.4, 0], { color: C_TRUC, width: 2.2, order: 4 }))
{ const mat = new THREE.MeshBasicMaterial({ color: C_TRUC }), geo = new THREE.ConeGeometry(0.14, 0.46, 18)
  const cx = new THREE.Mesh(geo, mat); cx.rotation.z = -Math.PI / 2; cx.position.set(7.7, 0, 0)
  const cy = new THREE.Mesh(geo, mat); cy.position.set(0, 6.4, 0); scene.add(cx, cy)
  for (const x of [A, P, B]) scene.add(mkLine([x, -0.13, 0, x, 0.13, 0], { color: C_TRUC, width: 2, order: 4 }))
  scene.add(mkLine([-0.13, 5, 0, 0.13, 5, 0], { color: C_TRUC, width: 2, order: 4 }))
  scene.add(mkLine([1, 0, 0, 1, 5, 0, 0, 5, 0], net)) }

// Hai đường + hình phẳng (H): phần trên trục (xanh), phần dưới trục (hồng)
scene.add(mkLine(pts(f, 0.75, 6.75, 120), { color: 0xe6efff, width: 2.6 }), mkLine(pts(g, -0.4, 7.2, 2), { color: 0xe6efff, width: 2.6 }))
function strip(top, bot, x0, x1, n) {
  const pos = [], idx = []
  for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n; pos.push(x, top(x), 0, x, bot(x), 0); if (i < n) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2) } }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx); return geo
}
const geoTren = strip(g, x => Math.max(f(x), 0), A, B, 200), geoDuoi = strip(() => 0, f, P, B, 160)
const mkMat = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false })
const matTren = mkMat(C_TREN, 0.42), matDuoi = mkMat(C_DUOI, 0.42)
const mesh2 = (geo, mat, order) => { const m = new THREE.Mesh(geo, mat); m.renderOrder = order; m.frustumCulled = false; return m }
scene.add(mesh2(geoTren, matTren, 2), mesh2(geoDuoi, matDuoi, 2))

// Mặt đang quay: bản sao của (H) ở góc phi
const faceG = new THREE.Group(); scene.add(faceG)
faceG.add(mesh2(geoTren, matTren, 2), mesh2(geoDuoi, matDuoi, 2), mkLine(pts(g, A, B, 2), { color: 0xe6efff, width: 2 }), mkLine(pts(f, A, B, 90), { color: 0xe6efff, width: 2 }))

// Mặt tròn xoay: lưới (x, góc); điểm (x; y; 0) quay góc t tới (x; y·cos t; y·sin t)
const NT = 72
function mkLuoi(nx, mat, order) {
  const pos = new Float32Array((nx + 1) * (NT + 1) * 3), idx = [], geo = new THREE.BufferGeometry()
  for (let i = 0; i < nx; i++) for (let j = 0; j < NT; j++) { const a = i * (NT + 1) + j, b = a + 1, c = a + NT + 1, d = c + 1; idx.push(a, c, b, b, c, d) }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setIndex(idx)
  const mesh = mesh2(geo, mat, order)
  return { mesh, mat, set(fn, x0, x1, phi) {
    let k = 0
    for (let i = 0; i <= nx; i++) { const x = x0 + (x1 - x0) * i / nx, y = fn(x); for (let j = 0; j <= NT; j++) { const t = phi * j / NT; pos[k++] = x; pos[k++] = y * Math.cos(t); pos[k++] = y * Math.sin(t) } }
    geo.attributes.position.needsUpdate = true; geo.computeVertexNormals()
  } }
}
// Khối sinh ra khi quay tới góc phi: mặt do g vạch (xanh), mặt do f vạch trên [a; p] (xanh, phía trong), mặt do f vạch trên [p; b] (hồng)
const phong = c => new THREE.MeshPhongMaterial({ color: c, transparent: true, opacity: 0.4, side: THREE.DoubleSide, depthWrite: false, shininess: 60, specular: 0x334455 })
const sweeps = [[mkLuoi(50, phong(C_TREN), 3), g, A, B], [mkLuoi(14, phong(C_TREN), 3), f, A, P], [mkLuoi(56, phong(C_DUOI), 3), f, P, B]]
for (const s of sweeps) scene.add(s[0].mesh)
// Vết của hai điểm: giao điểm (1; 5) và đỉnh parabol (4; −4); hai đường tròn ngăn ba miền trên khối
const arcOf = (x, y, phi) => { const o = []; for (let j = 0; j <= NT; j++) { const t = phi * j / NT; o.push(x, y * Math.cos(t), y * Math.sin(t)) } return o }
const arcA = mkLine(arcOf(1, 5, 0), { color: C_TREN, width: 2.4, order: 6 }), arcV = mkLine(arcOf(4, -4, 0), { color: C_DUOI, width: 2.4, order: 6 })
const ringP = mkLine(circ(P, g(P)), { color: 0xffffff, width: 1.6, opacity: 0.6, order: 6 }), ringQ = mkLine(circ(Q, g(Q)), { color: 0xffffff, width: 1.6, opacity: 0.6, order: 6 })
scene.add(arcA, arcV, ringP, ringQ)

// Bước 3: phần dưới lật quanh Ox (đi qua không gian) lên phía trên; đường gấp y = −f(x); đường bao ngoài + trong của hình sau khi gấp
const foldG = new THREE.Group(); scene.add(foldG)
foldG.add(mesh2(geoDuoi, mkMat(C_DUOI, 0.55), 2), mkLine(pts(f, P, B, 80), { color: C_DUOI, width: 3 }))
const gapLine = mkLine(pts(x => -f(x), P, B, 80), { color: C_DUOI, width: 2.4, dashed: true, dash: 0.3, gap: 0.2 })
const envOut = mkLine(pts(g, A, Q, 2).concat(pts(x => -f(x), Q, B, 60)), { color: C_NHAN, width: 5, order: 6 })
const envIn = mkLine(pts(f, A, P, 24), { color: 0xffe2ad, width: 5, order: 6 })
const vachQ = mkLine([Q, -0.13, 0, Q, 0.13, 0], { color: C_TRUC, width: 2, order: 4 })   // vạch x = q chỉ hiện từ bước 3
const moc = mkLine([P, 0, 0, P, g(P), 0], net), moc2 = mkLine([Q, 0, 0, Q, g(Q), 0], net)
scene.add(gapLine, envOut, envIn, moc, moc2, vachQ)

// Bước 4 (cái bẫy): công thức π∫(g² − f²) tính phần khối nằm GIỮA hai mặt bán kính g và |f| — xanh nơi g ở ngoài (được cộng), đỏ nơi |f| ở ngoài (bị trừ)
const bayG = new THREE.Group(); scene.add(bayG)
{ const lam = c => new THREE.MeshLambertMaterial({ color: c, side: THREE.DoubleSide })
  const them = (fn, x0, x1, nx, mat) => { const l = mkLuoi(nx, mat, 0); l.set(fn, x0, x1, TAU); bayG.add(l.mesh) }
  const xanh = lam(0x39c6ee), dout = lam(C_AM)
  them(g, A, Q, 30, xanh); them(x => Math.abs(f(x)), A, Q, 40, xanh)   // [a; q]: ngoài g, trong |f|
  them(x => -f(x), Q, B, 50, dout); them(g, Q, B, 30, dout) }          // [q; b]: ngoài |f|, trong g

// ═══ 5. NHÃN + CHẤM ĐIỂM ═══
const luon = () => true, daGap = () => S.step > 3 || (S.step === 3 && S.fold > 0.98), phangGap = () => S.step === 3 && daGap()
label('x', () => [7.75, 0, 0], luon, 0.3, 1); label('y', () => [0, 6.45, 0], luon, -0.9, 0); label('O', () => [0, 0, 0], luon, -0.8, 0.95)
label('5', () => [0, 5, 0], () => S.step <= 3, -0.8, 0)
label('y = f(x)', () => [6.75, f(6.75), 0], luon, 2.5, -0.2); label('y = g(x)', () => [7.2, g(7.2), 0], luon, 0.9, 1.05)
for (const [x, chu, dy] of [[A, 'a', 1.3], [P, 'p', 2.7], [Q, 'q', 1.3], [B, 'b', 1.3]]) {
  if (x !== Q) label(String(x), () => [x, 0, 0], () => S.step <= 2, x === B ? 0.55 : -0.05, 1.05)
  label(chu + ' = ' + x, () => [x, 0, 0], () => S.step >= 3, x === B ? 0.9 : 0, dy, 'dim')
}
label('1', () => [1.62, 3.2, 0], phangGap, 0, 0, 'so'); label('2', () => [2.5, 1.5, 0], phangGap, 0, 0, 'so'); label('3', () => [4.4, 1.7, 0], phangGap, 0, 0, 'so')   // số thứ tự ba miền
dot(() => [1, 5, 0], luon, 0xffffff, 0.12); dot(() => [6, 0, 0], luon, 0xffffff, 0.12); dot(() => [Q, g(Q), 0], daGap, C_NHAN, 0.15)

// ═══ 6. ĐỒNG BỘ HIỂN THỊ MỖI KHUNG HÌNH ═══
let phiVe = -1
function dongBo() {
  const st = S.step, phi = S.phi, du = phi >= TAU - 1e-3, co = phi > 0.002, bay = st === 4 && du
  if (phi !== phiVe) { phiVe = phi; for (const s of sweeps) s[0].set(s[1], s[2], s[3], phi); setLine(arcA, arcOf(1, 5, phi)); setLine(arcV, arcOf(4, -4, phi)); faceG.rotation.x = phi }
  for (const s of sweeps) s[0].mesh.visible = co && !bay
  faceG.visible = co && !du; arcA.visible = arcV.visible = co && !bay; ringP.visible = ringQ.visible = du && st === 5
  matTren.opacity = matDuoi.opacity = bay ? 0.2 : 0.42
  foldG.visible = st === 3 && S.fold > 0.001; foldG.rotation.x = Math.PI * S.fold
  gapLine.visible = st >= 3 && daGap(); envOut.visible = envIn.visible = phangGap()
  moc.visible = moc2.visible = vachQ.visible = st >= 3
  bayG.visible = bay
}

// ═══ 7. BẢNG LỜI GIẢI THEO BƯỚC (luật A3: công thức bằng chữ trước, thay số sau) ═══
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3.2v11H3.5zm5.8 0h3.2v11H9.3z"/></svg>'
const PANELS = {
  1: () => String.raw`<p class="kicker">Bước 1 · Đề bài</p><h2>Quay hình phẳng quanh trục Ox</h2>
    <p>Hình phẳng <i>(H)</i> giới hạn bởi parabol <i>y</i> = <i>f</i>(<i>x</i>) = <i>x</i>² − 8<i>x</i> + 12 và đường thẳng <i>y</i> = <i>g</i>(<i>x</i>) = −<i>x</i> + 6 (phần tô màu).</p>
    <p>Quay <i>(H)</i> quanh trục hoành. Tính thể tích khối tròn xoay tạo thành.</p>
    <div class="chips"><span>f(x) = x² − 8x + 12</span><span>g(x) = −x + 6</span><span class="q">V = ?</span></div>
    <p class="note">Chú ý: <i>(H)</i> nằm ở <b>cả hai phía</b> của trục quay. Phần <b class="tren">xanh</b> ở trên trục <i>Ox</i>, phần <b class="duoi">hồng</b> ở dưới trục.</p>
    <button type="button" class="btn" id="b1">Quay quanh Ox ›</button>`,
  2: () => String.raw`<p class="kicker">Bước 2 · Quay quanh Ox</p><h2>Quay một vòng</h2>
    <p>Mỗi điểm của <i>(H)</i> vạch một đường tròn quanh trục <i>Ox</i>. Phần xanh và phần hồng quay cùng lúc.</p>
    <div class="row"><button type="button" class="btn" id="b2"></button><span class="ro"><small>Góc quay</small><b id="r2">0°</b></span></div>
    <input type="range" id="s2" min="0" max="1000" value="0" aria-label="Góc quay quanh trục Ox">
    <ul class="cond">
      <li id="c2a"><i></i><span>Nửa vòng: phần dưới trục đã lên phía trên</span><em>180°</em></li>
      <li id="c2b"><i></i><span>Đủ một vòng: khối tròn xoay hoàn chỉnh</span><em>360°</em></li>
    </ul>
    <p class="note" id="n2" hidden>Trong khối này có chỗ phần xanh và phần hồng <b>chồng lên nhau</b>. Thể tích chỗ chồng chỉ được tính một lần.</p>`,
  3: () => String.raw`<p class="kicker">Bước 3 · Chia miền</p><h2>Gấp phần dưới lên, chia ba miền</h2>
    <p>Quay phần hồng quanh <i>Ox</i> cho ra đúng khối mà <b>ảnh đối xứng của nó qua <i>Ox</i></b> tạo ra. Vậy cứ gấp phần hồng lên trên trục: <i>y</i> = <i>f</i>(<i>x</i>) thành <i>y</i> = −<i>f</i>(<i>x</i>).</p>
    <button type="button" class="btn" id="b3"></button>
    <p class="lbl2">Công thức tròn xoay cho từng miền</p>
    <div class="fx">
      <div class="r2"><span data-d data-tex="V_1=\pi\int_a^p\left(g^2-f^2\right)\mathrm{d}x"></span><small>miền 1<br>giữa hai đường</small></div>
      <div class="r2"><span data-d data-tex="V_2=\pi\int_p^q g^2\,\mathrm{d}x"></span><small>miền 2<br>từ trục tới g</small></div>
      <div class="r2"><span data-d data-tex="V_3=\pi\int_q^b f^2\,\mathrm{d}x"></span><small>miền 3<br>từ trục tới −f</small></div>
    </div>
    <p class="lbl2">Thay số — a, b: f = g · p: f = 0 · q: g = −f</p>
    <div class="fx num">
      <div data-tex="f=g\iff x^2-7x+6=0\iff x=1,\ x=6"></div>
      <div data-tex="f=0\iff x=2,\ x=6"></div>
      <div data-tex="g=-f\iff x^2-9x+18=0\iff x=3,\ x=6"></div>
      <div class="res" data-tex="a=1,\quad p=2,\quad q=3,\quad b=6"></div>
    </div>`,
  4: () => String.raw`<p class="kicker">Bước 4 · Cái bẫy</p><h2>Áp một công thức cho cả đoạn thì sao?</h2>
    <p>Nhiều bạn không chia miền mà áp luôn công thức “hình phẳng giữa hai đường” cho cả đoạn [<i>a</i>; <i>b</i>]:</p>
    <div class="fx"><div data-d data-tex="V_{?}=\pi\int_a^b\left(g^2-f^2\right)\mathrm{d}x"></div></div>
    <p>Công thức này tính phần khối nằm <b>giữa</b> hai mặt bán kính <i>g</i> và |<i>f</i>|. Trên [<i>a</i>; <i>q</i>] thì <i>g</i> ≥ |<i>f</i>| nên phần đó được <b class="tren">cộng</b>; trên [<i>q</i>; <i>b</i>] thì |<i>f</i>| &gt; <i>g</i> nên phần đó bị <b class="am">trừ</b>.</p>
    <button type="button" class="btn" id="bSub"${S.thayBay ? ' hidden' : ''}>Thay số ›</button>
    <div class="subs" id="subs"${S.thayBay ? '' : ' hidden'}>
      <p class="lbl2">Thay số: a = 1, q = 3, b = 6</p>
      <div class="fx num">
        <div data-d data-tex="\pi\int_1^3\left(g^2-f^2\right)\mathrm{d}x=+\frac{108\pi}{5}"></div>
        <div data-d data-tex="\pi\int_3^6\left(g^2-f^2\right)\mathrm{d}x=-\frac{108\pi}{5}"></div>
        <div class="res" data-d data-tex="V_{?}=\frac{108\pi}{5}-\frac{108\pi}{5}=0"></div>
      </div>
      <p><b>Thể tích bằng 0</b>: vô lý, vì khối có thật. Sai ở hai chỗ:</p>
      <p>Miền 2: khối đặc tới tận trục, công thức lại khoét đi phần bán kính |<i>f</i>| ở giữa.</p>
      <p>Miền 3: mặt ngoài là |<i>f</i>| chứ không phải <i>g</i>, nên kết quả mang dấu âm.</p>
      <p class="note">Công thức π∫(<i>g</i>² − <i>f</i>²)d<i>x</i> chỉ đúng khi hình phẳng nằm hẳn một phía của trục quay (như miền 1).</p>
    </div>`,
  5: () => String.raw`<p class="kicker">Bước 5 · Tính thể tích</p><h2>Cộng ba miền</h2>
    <p class="lbl2">Công thức tổng quát (chưa thay số)</p>
    <div class="fx"><div data-d data-tex="\begin{aligned}V&=V_1+V_2+V_3\\[0.5em]&=\pi\int_a^p\left(g^2-f^2\right)\mathrm{d}x\\[0.5em]&\quad+\pi\int_p^q g^2\,\mathrm{d}x+\pi\int_q^b f^2\,\mathrm{d}x\end{aligned}"></div></div>
    <button type="button" class="btn" id="bSub"${S.thay ? ' hidden' : ''}>Thay số ›</button>
    <div class="subs" id="subs"${S.thay ? '' : ' hidden'}>
      <p class="lbl2">Thay số: a = 1, p = 2, q = 3, b = 6</p>
      <div class="fx num">
        <div data-d data-tex="V_1=\pi\int_1^2\left(g^2-f^2\right)\mathrm{d}x=\frac{64\pi}{5}"></div>
        <div data-d data-tex="V_2=\pi\int_2^3 g^2\,\mathrm{d}x=\frac{37\pi}{3}"></div>
        <div data-d data-tex="V_3=\pi\int_3^6 f^2\,\mathrm{d}x=\frac{153\pi}{5}"></div>
        <div class="res" data-d data-tex="V=\frac{64\pi}{5}+\frac{37\pi}{3}+\frac{153\pi}{5}=\frac{836\pi}{15}\approx 175{,}09"></div>
      </div>
      <p class="lbl2">Nguyên hàm đã dùng</p>
      <div class="fx">
        <div data-d data-tex="\int g^2\,\mathrm{d}x=-\frac{(6-x)^3}{3}"></div>
        <div data-d data-tex="\begin{aligned}\int f^2\,\mathrm{d}x&=\frac{x^5}{5}-4x^4+\frac{88x^3}{3}\\[0.4em]&\quad-96x^2+144x\end{aligned}"></div>
      </div>
      <p class="note">Cùng hai hàm <i>f</i>, <i>g</i> như ở bước 4, nhưng chia miền theo vị trí của <i>(H)</i> so với trục quay rồi mới lắp công thức.</p>
    </div>`,
}
function bindPanel() {   // khung vừa vẽ PANELS[bước]; ở đây gắn sự kiện + điền số
  const st = S.step
  if (st === 1) $('#b1').addEventListener('click', () => M.goStep(2, { play: true }))
  if (st === 2) {
    $('#b2').addEventListener('click', () => (S.playing ? stopPlay() : startPlay()))
    $('#s2').addEventListener('input', e => { stopPlay(); S.phi = e.target.value / 1000 * TAU; dirty = true })
    sync2()
  }
  if (st === 3) { $('#b3').addEventListener('click', () => foldTo(S.fold > 0.5 ? 0 : 1)); sync3() }
  if (st === 4 || st === 5) $('#bSub').addEventListener('click', thaySo)
}
function sync2() {
  const s = $('#s2'); if (!s) return
  const du = S.phi >= TAU - 1e-3
  if (document.activeElement !== s || S.playing) s.value = Math.round(S.phi / TAU * 1000)
  $('#r2').textContent = Math.round(S.phi * 180 / Math.PI) + '°'
  $('#c2a').classList.toggle('ok', S.phi >= Math.PI - 1e-3); $('#c2b').classList.toggle('ok', du); $('#n2').hidden = !du
  const lab = (S.playing ? ICON_PAUSE + 'Dừng' : ICON_PLAY + (du ? 'Quay lại' : 'Quay')), b = $('#b2')
  if (b.dataset.lab !== lab) { b.innerHTML = lab; b.dataset.lab = lab }
}
function sync3() { const b = $('#b3'); if (b) b.textContent = S.fold > 0.5 ? 'Trả phần hồng về chỗ cũ' : 'Gấp phần hồng lên' }
function thaySo() {   // bước 4, 5: công thức bằng chữ xong mới thay số
  if (S.step === 4) S.thayBay = true; else if (S.step === 5) S.thay = true; else return
  M.renderPanel(true); M.syncChips()
  const el = $('#subs'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: RM ? 'auto' : 'smooth' })
}

// ═══ 8. CHUYỂN BƯỚC ═══
function tween(get, set, target, ms, my) {
  return new Promise(res => {
    const a = get(), d = target - a
    if (Math.abs(d) < 1e-5) { set(target); dirty = true; return res() }
    const dur = RM ? 1 : ms, t0 = clock()
    anims.push(now => {
      if (!M.alive(my)) { res(); return true }
      const k = Math.min(1, (now - t0) / dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2
      set(a + d * e); dirty = true
      if (k >= 1) { res(); return true }
      return false
    })
  })
}
const phiTo = (t, ms, my) => tween(() => S.phi, v => { S.phi = v }, t, Math.max(300, ms * Math.abs(t - S.phi) / TAU), my)
const foldTo = t => tween(() => S.fold, v => { S.fold = v }, t, 1500, M.token())
function startPlay() {
  if (S.step !== 2) return
  if (S.phi >= TAU - 1e-3) S.phi = 0
  S.playing = true; dirty = true
  const my = M.token(), a = S.phi, t0 = clock(), dur = RM ? 1 : 9000 * (TAU - a) / TAU
  anims.push(now => {
    if (!S.playing || !M.alive(my)) return true
    const k = Math.min(1, (now - t0) / dur)
    S.phi = a + (TAU - a) * k; dirty = true
    if (k >= 1) { S.phi = TAU; S.playing = false; return true }
    return false
  })
}
function stopPlay() { if (S.playing) { S.playing = false; dirty = true } }
function truocBang(n, prev, o) {
  S.playing = false
  if (prev !== n || o.first) { if (n === 4) S.thayBay = !!o.sub; if (n === 5) S.thay = !!o.sub }   // mỗi lần vào lại bắt đầu từ công thức chưa thay số
}
async function khiDoiBuoc(n, prev, o, my) {
  if (o.first || gocCua(n) !== gocCua(prev)) setView('mac_dinh', o.first)
  // Góc quay đích của từng bước: 1, 3 = hình phẳng chưa quay · 2 = do người dùng điều khiển · 4, 5 = khối đã quay đủ vòng
  const dich = n === 1 || n === 3 ? 0 : n === 2 ? (prev > 2 ? TAU : S.phi) : TAU
  if (n !== 3) S.fold = 0
  if (o.first) { S.phi = dich; if (n === 3 && o.sub) S.fold = 1; dirty = true; return }
  await phiTo(dich, 1300, my); if (!M.alive(my)) return
  if (n === 2 && (o.play || o.next)) startPlay()
}

// ═══ 9. CHẠY ═══
M.start()
Object.assign(window.__dbg, { S, f, g })
})()
</script>
