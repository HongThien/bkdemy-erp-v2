<!doctype html>
<html lang="vi">

<title>Cốc nước nghiêng · Thể tích bằng tích phân</title>
<meta name="description" content="Mô hình 3D xoay được: nghiêng cốc nước hình trụ, khối nước thành cái nêm, cắt lát theo ba hướng rồi cộng lại để ra thể tích 240 cm³.">

<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegmentsGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineMaterial.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegments2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/Line2.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="khung.js"></script>
<script>
// BÀI: Câu 43 (NBV 12-18 F) — cốc nước nghiêng. Phần dùng chung nằm ở khung.js / khung.css; file này chỉ có vật thể + bảng lời giải.
(function () {
'use strict'
// ═══ 1. SỐ LIỆU CỦA BÀI (đổi bài = đổi khối này + mục 5) ═══
const R = 6, H = 10                      // bán kính lòng đáy, chiều cao lòng cốc (cm)
const TAN = H / R, ALPHA = Math.atan(TAN) // mặt nước lúc cuối nghiêng góc α với đáy, tan α = h/R
const V0 = 2 * R * R * H / 3              // = 240 — thể tích nước (đáp số)
const H0 = V0 / (Math.PI * R * R)         // mực nước khi cốc đứng ≈ 2,122

// ═══ 2. KHUNG CHUNG (khung.js): sân khấu, máy quay kéo-xoay, nét dày, nhãn, thanh bước ═══
const M = MoHinh({
  nhan: 'Toán 12 · Ứng dụng tích phân · Thể tích', tieuDe: 'Cốc nước nghiêng',
  buoc: ['Đề bài', 'Nghiêng cốc', 'Khối nước', 'Cắt một lát', 'Cộng các lát', 'Tính thể tích'],
  nutGoc: [['mac_dinh', 'Góc ban đầu'], ['ngang', 'Nhìn ngang'], ['tren', 'Nhìn từ trên']],
  goc: {   // máy quay đứng phía −x: trục z chạy sang phải màn hình, đường kính AB (trục x) chạy theo chiều sâu
    nghieng: { az: -Math.PI / 2 - 0.34, pol: 1.3 },
    sach: { az: -Math.PI / 2 + 0.16, pol: 0.9 },
    ngang: { az: -Math.PI / 2, pol: 1.52 },
    tren: { az: -Math.PI / 2, pol: 0.14 },
    cat_x: { az: -Math.PI / 2 + 0.16, pol: 0.9 },    // lát ⟂ AB: nhìn dọc AB thấy tam giác gần chính diện
    cat_y: { az: -Math.PI / 2 + 0.16, pol: 0.6 },    // lát song song đáy: nhìn chếch từ trên xuống
    cat_z: { az: -Math.PI / 2 - 1.05, pol: 1.02 },   // lát song song AB: vòng sang phía mặt nước để thấy hình chữ nhật
  },
  khung: { nghieng: { tx: 0, ty: 6.3, tz: 4.3, r: 13.4 }, sach: { tx: 0, ty: 4.5, tz: 1.8, r: 9.6 } },
  khungNao: () => (M.step <= 2 ? 'nghieng' : 'sach'), gocMacDinh: () => (M.step <= 2 ? 'nghieng' : 'sach'),
  bang: n => PANELS[n](), sauBang: bindPanel, truocBang, khiDoiBuoc,
  moiKhung: () => { if (dirty) { dirty = false; pivot.rotation.x = S.theta; updateWater(); sync2() } },
  dongBo: syncScene,
  tiep: () => { if (M.step !== 6) return false; thaySo(); return true },   // ở bước cuối, nút Tiếp (và phím →) dùng để thay số
  nutTiep: () => (M.step === 6 ? { chu: S.subbed ? 'Tiếp ›' : 'Thay số ›', tat: S.subbed } : null),
  phimCach: () => { if (M.step !== 2) return false; S.playing ? stopPlay() : startPlay(); return true },
  thamSo: q => {   // ?huong=x|y|z · ?n=16 · ?thay=1 (bước 6 đã thay số)
    const ax = q.get('huong'), n = +q.get('n')
    if (AX[ax] !== undefined) S.axis = ax
    if ([4, 8, 16, 32, 64].includes(n)) S.n = n
    return { sub: q.get('thay') === '1' }
  },
})
if (!M) return
const { RM, $, $$, clamp, fmt, tn, tex, scene, camera, mkLine, setLine, setView, clock, anims, label, dot, flat, capNet } = M

// ═══ 3. TRẠNG THÁI ═══
const S = {
  theta: 0,          // góc nghiêng của cốc (0 → α)
  frozen: false,     // true = nước "đông cứng" thành cái nêm, gắn theo cốc; false = nước lỏng, mặt nước luôn nằm ngang
  melted: false,     // bước 6: đã dựng cốc đứng cho nước chảy lại
  subbed: false,     // bước 6: đã bấm "Thay số" (mặc định chỉ hiện công thức bằng chữ)
  playing: false,
  axis: 'x', t: { x: 2.4, y: 4, z: 3.6 },   // hướng cắt + vị trí lát
  n: 8, reveal: 8,   // số lát khi cộng + số lát đã hiện (hoạt cảnh)
  showCup: true,
}
let dirty = true
Object.defineProperty(S, 'step', { get: () => M.step })   // số bước do khung giữ

// ═══ 4. VẬT THỂ ═══
// Hệ toạ độ CỦA CỐC: đáy nằm trong mặt y = 0, tâm đáy O ở gốc, trục cốc = trục y.
// Đường kính AB nằm trên trục x. Khối nước cuối cùng: 0 ≤ y ≤ z·tanα, z ≥ 0 (điểm chạm miệng I(0; h; R)).
// Cốc nghiêng quanh mép đáy K(0;0;R) đặt trên mặt bàn: pivot ở K, quay quanh trục x góc theta.
const pivot = new THREE.Group(); pivot.position.set(0, 0, R); scene.add(pivot)
const cup = new THREE.Group(); cup.position.set(0, 0, -R); pivot.add(cup)
M.local = cup   // nhãn + chấm điểm của bài này tính trong hệ toạ độ của cốc

// Mặt bàn (mốc nằm ngang để thấy mặt nước luôn song song với bàn)
const table = new THREE.Mesh(new THREE.CircleGeometry(24, 96), new THREE.MeshBasicMaterial({ color: 0x7daaff, transparent: true, opacity: 0.05, depthWrite: false, side: THREE.DoubleSide }))
table.rotation.x = -Math.PI / 2; table.position.set(0, -0.02, 4); table.renderOrder = 0; scene.add(table)
const circle = (r, y, n) => { const P = []; for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2; P.push(r * Math.cos(a), y, r * Math.sin(a)) } return P }
{ const ring = mkLine(circle(24, 0, 128), { color: 0x7daaff, width: 1.5, opacity: 0.3, order: 0 }); ring.position.set(0, -0.02, 4); scene.add(ring) }

// Cốc thủy tinh
const glass = new THREE.Group(); cup.add(glass)
const glassMat = new THREE.MeshBasicMaterial({ color: 0xbfd6ff, transparent: true, opacity: 0.07, side: THREE.DoubleSide, depthWrite: false })
{ const wall = new THREE.Mesh(new THREE.CylinderGeometry(R, R, H, 80, 1, true), glassMat); wall.position.y = H / 2; wall.renderOrder = 1; glass.add(wall)
  const bot = new THREE.Mesh(new THREE.CircleGeometry(R, 80), glassMat); bot.rotation.x = -Math.PI / 2; bot.renderOrder = 1; glass.add(bot) }
const glassLines = [mkLine(circle(R, H, 120), { color: 0xe6efff, width: 2.6, order: 4 }), mkLine(circle(R, 0, 120), { color: 0xe6efff, width: 2, order: 4 }),
  mkLine([0, 0, 0, 0, H, 0], { color: 0xe6efff, width: 2.6, order: 4 }), mkLine([0, 0, 0, 0, H, 0], { color: 0xe6efff, width: 2.6, order: 4 })]
glassLines.forEach(l => glass.add(l))

// Khối nước: lưới tự dựng "mọi điểm trong đáy, cao từ 0 tới mặt phẳng y = z·t + c" (t = tan góc nghiêng, c = độ cao tại trục)
const NZ = 60, NX = 22, nTop = (NZ + 1) * (NX + 1), oW = nTop * 2, nVert = oW + (NZ + 1) * 4
const wPos = new Float32Array(nVert * 3), wNor = new Float32Array(nVert * 3)
const waterGeo = new THREE.BufferGeometry()
{ const idx = []
  for (let i = 0; i < NZ; i++) for (let j = 0; j < NX; j++) { const a = i * (NX + 1) + j, b = a + 1, c = a + NX + 1, d = c + 1; idx.push(a, c, b, b, c, d, nTop + a, nTop + b, nTop + c, nTop + b, nTop + d, nTop + c) }
  for (let i = 0; i < NZ; i++) { const a = oW + i * 4, b = a + 4; idx.push(a, a + 1, b, a + 1, b + 1, b, a + 2, b + 2, a + 3, a + 3, b + 2, b + 3) }
  waterGeo.setAttribute('position', new THREE.BufferAttribute(wPos, 3)); waterGeo.setAttribute('normal', new THREE.BufferAttribute(wNor, 3)); waterGeo.setIndex(idx) }
const waterMat = new THREE.MeshPhongMaterial({ color: 0x2fb9e8, transparent: true, opacity: 0.52, side: THREE.DoubleSide, depthWrite: false, shininess: 70, specular: 0x335566, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 2 })
const water = new THREE.Mesh(waterGeo, waterMat); water.renderOrder = 3; water.frustumCulled = false; cup.add(water)
// Lượt vẽ "chỉ ghi độ sâu" của khối nêm — nhờ nó các cạnh bị che vẽ được bằng NÉT ĐỨT như hình trong sách.
const prepass = new THREE.Mesh(waterGeo, new THREE.MeshBasicMaterial({ colorWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 2 }))
prepass.renderOrder = -10; prepass.frustumCulled = false; cup.add(prepass)

const W = { t: 0, c: H0, zmin: -R, gap: H - H0, wedge: false }
const rowZ = new Float32Array(NZ + 1), rowW = new Float32Array(NZ + 1), rowY = new Float32Array(NZ + 1)
const edgeP = new Array((2 * (NZ + 1) + 1) * 3).fill(0)
const waterEdge = mkLine(edgeP, { color: 0xa9f1ff, width: 2.6, order: 5 }); cup.add(waterEdge)          // viền mặt nước
const chord = mkLine([0, 0, 0, 1, 0, 0], { color: 0xffb547, width: 4.5, order: 7, depthTest: false }); cup.add(chord)   // mép nước trên đáy
function buildWater(t, c) {
  const zmin = t > 1e-9 ? clamp(-c / t, -R, R) : -R
  const nl = Math.hypot(1, t), ny = 1 / nl, nz = -t / nl
  const put = (k, x, y, z, a, b, d) => { wPos[k] = x; wPos[k + 1] = y; wPos[k + 2] = z; wNor[k] = a; wNor[k + 1] = b; wNor[k + 2] = d }
  for (let i = 0; i <= NZ; i++) {
    const z = zmin + (R - zmin) * (1 - Math.cos(Math.PI * i / NZ)) / 2, w = Math.sqrt(Math.max(0, R * R - z * z)), y = clamp(z * t + c, 0, H)
    rowZ[i] = z; rowW[i] = w; rowY[i] = y
    for (let j = 0; j <= NX; j++) { const x = (-1 + 2 * j / NX) * w, k = (i * (NX + 1) + j) * 3; put(k, x, y, z, 0, ny, nz); put(k + nTop * 3, x, 0, z, 0, -1, 0) }
    const q = (oW + i * 4) * 3, a = w / R, d = z / R
    put(q, -w, 0, z, -a, 0, d); put(q + 3, -w, y, z, -a, 0, d); put(q + 6, w, 0, z, a, 0, d); put(q + 9, w, y, z, a, 0, d)
  }
  waterGeo.attributes.position.needsUpdate = true; waterGeo.attributes.normal.needsUpdate = true
  let k = 0
  for (let i = 0; i <= NZ; i++) { edgeP[k++] = -rowW[i]; edgeP[k++] = rowY[i]; edgeP[k++] = rowZ[i] }
  for (let i = NZ; i >= 0; i--) { edgeP[k++] = rowW[i]; edgeP[k++] = rowY[i]; edgeP[k++] = rowZ[i] }
  edgeP[k++] = -rowW[0]; edgeP[k++] = rowY[0]; edgeP[k++] = rowZ[0]
  setLine(waterEdge, edgeP)
  setLine(chord, [-rowW[0], 0, zmin, rowW[0], 0, zmin])
  W.t = t; W.c = c; W.zmin = zmin; W.gap = H - Math.min(H, R * t + c)
}
// Mực nước khi cốc nghiêng: tìm c để thể tích phần nước = V0 (chia đôi). Thể tích = ∫ 2√(R²−z²)·kẹp(z·t+c; 0; h) dz.
const QN = 360, qz = new Float32Array(QN), qw = new Float32Array(QN)
for (let i = 0; i < QN; i++) { const z = -R + (i + 0.5) * 2 * R / QN; qz[i] = z; qw[i] = 2 * Math.sqrt(R * R - z * z) * 2 * R / QN }
function vol(t, c) { let s = 0; for (let i = 0; i < QN; i++) { const y = qz[i] * t + c; s += qw[i] * (y <= 0 ? 0 : y >= H ? H : y) } return s }
function level(t) { let lo = -R * t, hi = H; for (let k = 0; k < 44; k++) { const m = (lo + hi) / 2; if (vol(t, m) < V0) lo = m; else hi = m } return (lo + hi) / 2 }
function updateWater() {
  if (S.frozen) { if (!W.wedge) { buildWater(TAN, 0); W.wedge = true } return }
  W.wedge = false
  const end = S.theta >= ALPHA - 1e-6, t = end ? TAN : Math.tan(S.theta)
  buildWater(t, end ? 0 : level(t))
}

// Cạnh của cái nêm: mỗi cạnh vẽ 2 lần — nét liền (chỗ nhìn thấy) + nét đứt (chỗ bị khối che); M.capNet của khung lo
const bookSolid = new THREE.Group(), bookDash = new THREE.Group(), consSolid = new THREE.Group(), consDash = new THREE.Group()
cup.add(bookSolid, bookDash, consSolid, consDash)
{ const arcB = [], arcT = [], al = [], N = 72
  for (let i = 0; i <= N; i++) { const a = i / N * Math.PI; arcB.push(R * Math.cos(a), 0, R * Math.sin(a)); arcT.push(R * Math.cos(a), H * Math.sin(a), R * Math.sin(a)) }
  capNet([-R, 0, 0, R, 0, 0], { color: 0xffb547, width: 3.4 }, bookSolid, bookDash)   // đường kính AB
  capNet(arcB, { color: 0xbff3ff, width: 3 }, bookSolid, bookDash)                    // nửa đường tròn đáy
  capNet(arcT, { color: 0xbff3ff, width: 3 }, bookSolid, bookDash)                    // nửa elip trên thành cốc
  capNet([0, 0, 0, 0, 0, R], { color: 0xffffff, width: 2, opacity: 0.9 }, consSolid, consDash)   // OK
  capNet([0, 0, R, 0, H, R], { color: 0xffffff, width: 2, opacity: 0.9 }, consSolid, consDash)   // KI
  capNet([0, 0, 0, 0, H, R], { color: 0xffffff, width: 2, opacity: 0.9 }, consSolid, consDash)   // OI
  for (let i = 0; i <= 16; i++) { const a = i / 16 * ALPHA; al.push(0, 1.7 * Math.sin(a), 1.7 * Math.cos(a)) }
  capNet(al, { color: 0xffb547, width: 2.2 }, consSolid, consDash)                                // cung góc α
  capNet([0, 0, R - 0.8, 0, 0.8, R - 0.8, 0, 0.8, R], { color: 0xffffff, width: 1.6, opacity: 0.8 }, consSolid, consDash)   // góc vuông tại K
}
const wSil = [mkLine([0, 0, 0, 0, 1, 0], { color: 0xbff3ff, width: 3 }), mkLine([0, 0, 0, 0, 1, 0], { color: 0xbff3ff, width: 3 })]   // đường sinh biên của nêm
wSil.forEach(l => cup.add(l))

// ═══ 5. LÁT CẮT ═══
// Ba hướng cắt. poly(axis, t) = đa giác lát cắt (lồi) tại vị trí t; area = diện tích đúng của lát.
const AX = { x: 0, y: 1, z: 2 }, RANGE = { x: [-R, R], y: [0, H], z: [0, R] }
function poly(ax, t) {
  if (ax === 'x') { const w = Math.sqrt(Math.max(0, R * R - t * t)); return [[t, 0, 0], [t, 0, w], [t, w * TAN, w]] }          // tam giác vuông MNP
  if (ax === 'z') { const w = Math.sqrt(Math.max(0, R * R - t * t)); return [[-w, 0, t], [w, 0, t], [w, t * TAN, t], [-w, t * TAN, t]] }   // hình chữ nhật
  const d = t / TAN, f0 = Math.asin(clamp(d / R, 0, 1)), P = [], K = 30                                                  // hình viên phân: phần z ≥ d của hình tròn
  for (let i = 0; i <= K; i++) { const a = f0 + (Math.PI - 2 * f0) * i / K; P.push([R * Math.cos(a), t, R * Math.sin(a)]) }
  return P
}
function area(ax, t) {
  if (ax === 'x') return 0.5 * (R * R - t * t) * TAN
  if (ax === 'z') return 2 * Math.sqrt(Math.max(0, R * R - t * t)) * t * TAN
  const b = Math.acos(clamp(t / TAN / R, 0, 1)); return R * R * (b - Math.sin(b) * Math.cos(b))
}

const sliceGroup = new THREE.Group(); cup.add(sliceGroup)
const sliceMesh = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({ color: 0xffb547, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthTest: false, depthWrite: false }))
sliceMesh.renderOrder = 2; sliceMesh.frustumCulled = false; sliceGroup.add(sliceMesh)
const sliceEdge = mkLine([0, 0, 0, 1, 0, 0], { color: 0xfff1d6, width: 3, depthTest: false, order: 8 }); sliceGroup.add(sliceEdge)
const auxCircle = mkLine(circle(R, 0, 96), { color: 0xffb547, width: 1.6, opacity: 0.45, order: 6 }); sliceGroup.add(auxCircle)       // hướng y: cả hình tròn ở độ cao y
const auxRad = mkLine([0, 0, 0, 1, 0, 0, 2, 0, 0], { color: 0xffe2ad, width: 2, depthTest: false, order: 8 }); sliceGroup.add(auxRad)   // hướng y: E–H–F
function updateSlice() {
  const ax = S.axis, t = S.t[ax], P = poly(ax, t), g = new THREE.BufferGeometry(), idx = []
  g.setAttribute('position', new THREE.Float32BufferAttribute(flat(P), 3))
  for (let i = 1; i < P.length - 1; i++) idx.push(0, i, i + 1)
  g.setIndex(idx); sliceMesh.geometry.dispose(); sliceMesh.geometry = g
  setLine(sliceEdge, flat(P, true))
  const y = ax === 'y'; auxCircle.visible = auxRad.visible = y
  if (y) { auxCircle.position.y = t; const e = P[0]; setLine(auxRad, [e[0], t, e[2], 0, t, 0, 0, t, t / TAN]) }
}

// Chồng n lát (M.chongLat của khung): mỗi lát = lăng trụ có đáy là lát cắt ở GIỮA khoảng, dày Δ (quy tắc điểm giữa)
const CL = M.chongLat(cup)
function playSlabs() {
  const ax = S.axis
  CL.chay({ poly: t => poly(ax, t), truc: AX[ax], lo: RANGE[ax][0], hi: RANGE[ax][1], n: S.n, dienTich: t => area(ax, t), canhBen: ax === 'y' ? np => [0, np - 1] : null },
    { con: () => S.step === 5, khi: r => { S.reveal = r; syncSum() } })
}

// ═══ 6. NHÃN + CHẤM ĐIỂM (toạ độ trong hệ của cốc) ═══
const atEnd = () => S.frozen || (S.step === 2 && S.theta >= ALPHA - 1e-3)
const cons = () => S.frozen && (S.step === 3 || S.step === 6)
const upright = () => S.theta < 0.02
const cutX = () => S.frozen && S.step === 4 && S.axis === 'x' && upright(), cutY = () => S.frozen && S.step === 4 && S.axis === 'y' && upright()
const Mx = () => S.t.x, wX = () => Math.sqrt(Math.max(0, R * R - S.t.x * S.t.x))
label('A', () => [-R, 0, 0], atEnd, -1, 0.5, 'hot'); label('B', () => [R, 0, 0], atEnd, 1, -0.4, 'hot'); label('I', () => [0, H, R], atEnd, 0.9, -0.7)
label('O', () => [0, 0, 0], cons, -0.9, 0.3); label('K', () => [0, 0, R], cons, 0.9, 0.6)
label('R = 6', () => [0, 0, R / 2], cons, 0, 1.2, 'dim'); label('h = 10', () => [0, H / 2, R], cons, 2.7, 0, 'dim'); label('α', () => [0, 1.25, 2.5], cons, 0, 0, 'hot')
label('M', () => [Mx(), 0, 0], cutX, -0.9, 0.4); label('N', () => [Mx(), 0, wX()], cutX, 0.7, 0.8); label('P', () => [Mx(), wX() * TAN, wX()], cutX, 0.8, -0.7)
label('H', () => [0, S.t.y, 0], cutY, -0.9, -0.3); label('F', () => [0, S.t.y, S.t.y / TAN], cutY, 0.2, 1)

function syncScene() {
  const st = S.step, liquid = !S.frozen, book = S.frozen && (st === 3 || st === 4 || st === 6), up = S.theta < 0.02
  prepass.visible = book
  waterMat.opacity = liquid ? 0.52 : st === 5 ? 0.13 : 0.36

  chord.visible = liquid && W.zmin > -R + 0.02
  bookSolid.visible = !liquid; bookDash.visible = book

  const g = liquid ? 1 : S.showCup ? 0.3 : 0
  glass.visible = g > 0; glassMat.opacity = liquid ? 0.07 : 0.025

  sliceGroup.visible = S.frozen && st === 4 && up
  CL.nhom.visible = S.frozen && st === 5 && up

  camL.copy(camera.position); cup.worldToLocal(camL)
  const rho = Math.hypot(camL.x, camL.z), ok = rho > R * 1.02
  const psi = Math.atan2(camL.z, camL.x), dl = ok ? Math.acos(R / rho) : 0
  for (let i = 0; i < 2; i++) {

    glassLines[2 + i].visible = ok; if (ok) setLine(glassLines[2 + i], [x, 0, z, x, H, z])

  }
}

function tiltTo(target, ms, my) {
  return new Promise(res => {
    const a = S.theta, d = target - a
    if (Math.abs(d) < 1e-5) { S.theta = target; dirty = true; return res() }
    const dur = RM ? 1 : Math.max(280, ms * Math.abs(d) / ALPHA), t0 = clock()
    anims.push(now => {
      if (!M.alive(my)) { res(); return true }
      const k = Math.min(1, (now - t0) / dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2
      S.theta = a + d * e; dirty = true
      if (k >= 1) { res(); return true }
      return false
    })
  })
}
function startPlay() {
  if (S.step !== 2) return
  if (S.theta >= ALPHA - 1e-3) S.theta = 0
  S.playing = true; dirty = true
  const my = M.token(), a = S.theta, t0 = clock(), dur = RM ? 1 : 7500 * (ALPHA - a) / ALPHA
  anims.push(now => {
    if (!S.playing || !M.alive(my)) return true
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 1.6)   // chậm dần về cuối để kịp nhìn hai điều kiện cùng xảy ra
    S.theta = a + (ALPHA - a) * e; dirty = true
    if (k >= 1) { S.theta = ALPHA; S.playing = false; return true }
    return false
  })
}
function stopPlay() { if (S.playing) { S.playing = false; dirty = true } }
function truocBang(n, prev, o) {   // khung gọi trước khi vẽ bảng: đặt lại trạng thái riêng của bài
  S.playing = false; if (n !== 6) S.melted = false
  if (prev !== 6 || o.first) S.subbed = !!o.sub   // mỗi lần vào bước 6 lại bắt đầu từ công thức chưa thay số
}
async function khiDoiBuoc(n, prev, o, my) {   // khung gọi sau khi vẽ bảng: góc nhìn + hoạt cảnh chuyển bước
  $('#vDef').textContent = n <= 2 ? 'Góc ban đầu' : 'Góc nhìn sách'; $('#vCup').hidden = n <= 2
  if ((prev <= 2) !== (n <= 2) || o.first) setView('mac_dinh', o.first)
  // Nước lỏng ↔ nêm đông cứng chỉ đổi cho nhau ở đúng góc α (lúc đó hai hình trùng khít), nên luôn đi qua α.
  const wantFrozen = n >= 3 && !S.melted
  if (o.first) { S.frozen = wantFrozen; S.theta = 0; dirty = true; if (n === 5) playSlabs(); return }
  if (wantFrozen) { if (!S.frozen) { await tiltTo(ALPHA, 800, my); if (!M.alive(my)) return; S.frozen = true; dirty = true } await tiltTo(0, 1100, my); if (n === 5 && M.alive(my)) playSlabs() }
  else {
    if (S.frozen) { await tiltTo(ALPHA, 800, my); if (!M.alive(my)) return; S.frozen = false; dirty = true }
    if (n !== 2) await tiltTo(0, 1100, my)
    else if (o.play || o.next) startPlay()   // bấm "Nghiêng cốc" hoặc nút Tiếp từ bước 1 thì tự chạy
  }
}
M.views.insertAdjacentHTML('beforeend', '<button type="button" id="vCup" aria-pressed="true" hidden>Hiện cốc</button>')
$('#vCup').addEventListener('click', e => { S.showCup = !S.showCup; e.currentTarget.setAttribute('aria-pressed', S.showCup); e.currentTarget.textContent = S.showCup ? 'Hiện cốc' : 'Ẩn cốc' })

// ═══ 10. CHẠY ═══
M.start()
Object.assign(window.__dbg, { S, W, area, level })
})()
